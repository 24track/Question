    function commit(){
      const val = inputEl.value.trim();
      if (!val) return;
      onCommit(val, true);
    }
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); commit(); } });
    inputEl.addEventListener("blur", commit);
  }
  function addableOptionsHtml(values, current, includeNone, labelFn){
    const label = labelFn || (v => v.charAt(0).toUpperCase()+v.slice(1));
    let html = includeNone ? `<option value="" ${!current?"selected":""}>None</option>` : "";
    values.forEach(v => { html += `<option value="${escapeHtml(v)}" ${v===current?"selected":""}>${escapeHtml(label(v))}</option>`; });
    html += `<option value="__new__">+ Add new</option>`;
    return html;
  }
  function requestsForCustomer(name){ const k = normCustomer(resolveCustomer(name)); return state.requests.filter(r => r.customers.some(c => normCustomer(c) === k)); }
  function requestsForTag(type, value){ return state.requests.filter(r => (r[type]||"").toLowerCase() === value.toLowerCase()); }
  function reqLinks(list){ return list.map(r => `<span class="src" data-go-req="${r.id}">${escapeHtml(r.title)}</span>`).join(", "); }

  // ---------------- Priority score (unchanged formula) ----------------
  function computeScoreParts(r){
    const w = state.scoreWeights;
    const urgencyPart = (URGENCY_RANK[r.urgency] || 0) * w.urgency;
    const customerPart = r.customers.length * w.customers;
    const questionPart = r.questionCount * w.questions;
    const agePart = Math.floor((Date.now() - r.createdAt) / 86400000) * w.age;
    let duePart = 0;
    if (r.dueDate){
      const d = daysUntil(r.dueDate);
      duePart = d <= 0 ? w.dueDate * (10 + Math.min(20, -d)) : w.dueDate * Math.max(0, 10 - d/3);
    }
    const total = urgencyPart + customerPart + questionPart + agePart + duePart;
    return { urgencyPart, customerPart, questionPart, agePart, duePart, total };
  }
  function scoreOf(r){ return computeScoreParts(r).total; }

  function ageLabel(ts){ const d = Math.floor((Date.now()-ts)/86400000); return d === 0 ? "today" : d+"d ago"; }
  // Due dates are calendar dates, not moments: compare local calendar days so a
  // request due today reads "due today" all day, and is only overdue from the
  // next day. Math.round absorbs the 23/25-hour days around DST changes.
  function startOfDay(ts){ const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysUntil(ts){ return Math.round((startOfDay(ts) - startOfDay(Date.now())) / 86400000); }
  function dueLabel(ts){
    if (!ts) return null;
    const d = daysUntil(ts);
    return d === 0 ? "due today" : d < 0 ? (-d)+"d overdue" : "due in "+d+"d";
  }
  function dueShort(ts){
    if (!ts) return "no due date";
    return dueLabel(ts);
  }
  // Local YYYY-MM-DD for the date picker (toISOString would use UTC and can
  // show the previous day in timezones ahead of UTC).
  function dateInputValue(ts){
    const d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dueDateText(ts){ return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
  // Shipped requests are finished, so they show just the date: never
  // "overdue" and never red. (The score itself is unchanged; see docs/DESIGN.md.)
  function dueLabelFor(r){ return isShipped(r) ? dueDateText(r.dueDate) : dueLabel(r.dueDate); }
  function isDueSoon(r){ return !!r.dueDate && !isShipped(r) && daysUntil(r.dueDate) <= 3; }

  // ---------------- Clustering of unmatched questions (unchanged logic) ----------------
  function clusterUnmatchedQuestions(){
    const clusters = [];
    state.questions.filter(q => !q.matchedRequestId).forEach(q => {
      const words = stem(q.text);
      const threshold = words.length === 0 ? Infinity : Math.min(2, words.length);
      const target = clusters.find(c => overlap(new Set(words), c.words) >= threshold);
      if (target){ target.items.push(q); target.words.push(...words); }
      else clusters.push({ words: words.slice(), items: [q] });
    });
    return clusters.filter(c => c.items.length > 1).sort((a,b) => b.items.length - a.items.length);
  }
  function clusterLabel(cluster){
    // Top shared stem(s) across the cluster, title-cased — used as the theme
    // name shown in the UI and as the draft title when raised as a request.
    const freq = new Map();
    cluster.items.forEach(q => { new Set(stem(q.text)).forEach(w => freq.set(w, (freq.get(w)||0)+1)); });
    const sorted = Array.from(freq.entries()).sort((a,b) => b[1]-a[1]);
    const top = sorted.filter(([,n]) => n > 1).slice(0,2).map(([w]) => w);
    const words = top.length ? top : (sorted[0] ? [sorted[0][0]] : ["untitled theme"]);
    return words.map(w => w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
  }
  function customerRequestIndex(){
    const map = new Map();
    state.requests.forEach(r => r.customers.forEach(c => {
      if (!map.has(c)) map.set(c, []);
      map.get(c).push(r);
    }));
    return map;
  }
  function findClusterContaining(q){
    return clusterUnmatchedQuestions().find(c => c.items.includes(q)) || null;
  }

  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  // =====================================================================
  //  Navigation shell
  // =====================================================================
  const navEl = document.getElementById("mainNav");
  function renderNav(){
    const items = [];
    if (state.activeScreen === "answer") items.push({ key: "answer", label: "Ask", crumb: true });
    items.push({ key: "now", label: "Now" }, { key: "requests", label: "Requests" }, { key: "trends", label: "Trends" });
    navEl.innerHTML = items.map(it => {
      const active = it.key === state.activeScreen || (it.crumb);
      const cls = it.crumb ? "ask-crumb" : (it.key === state.activeScreen ? "active" : "");
      return `<button class="${cls}" data-nav="${it.key}" ${it.crumb ? "disabled" : ""}>${it.label}</button>`;
    }).join("");
    navEl.querySelectorAll("[data-nav]:not(.ask-crumb)").forEach(b => {
      b.onclick = () => { state.activeScreen = b.getAttribute("data-nav"); state.currentAnswer = null; render(); };
    });
  }

  const mainEl = document.getElementById("main");
  function render(){
    renderNav();
    if (state.activeScreen === "answer" && state.currentAnswer) mainEl.innerHTML = renderAnswerScreen();
    else if (state.activeScreen === "requests") mainEl.innerHTML = renderRequestsScreen();
    else if (state.activeScreen === "trends") mainEl.innerHTML = renderTrendsScreen();
    else mainEl.innerHTML = renderNowScreen();
    wireScreenInteractions();
  }

  // =====================================================================
  //  Now screen (1a)
  // =====================================================================
  function reasonSentence(r){
    const bits = [];
    if (r.customers.length > 0) bits.push(`<b>${r.customers.length} customer${r.customers.length===1?"":"s"}</b> ${r.customers.length===1?"is":"are"} waiting on it`);
    if (r.questionCount > 0) bits.push(`<b>${r.questionCount} question${r.questionCount===1?"":"s"}</b> ${r.questionCount===1?"has":"have"} come in about it`);
    let dueClause = "";
    if (r.dueDate){
      const soon = isDueSoon(r);
      dueClause = `it's ${soon ? `<span class="due-soon">${dueLabel(r.dueDate)}</span>` : dueLabel(r.dueDate)}`;
      bits.push(dueClause);
    }
    let sentence = bits.length ? bits.join(", ").replace(/,([^,]*)$/, " and$1") + "." : "";
    let statusClause = "";
    if (r.status === "in-progress") statusClause = "It's already in progress, so finishing it is worth more than starting something new.";
    else if (r.status === "planned") statusClause = `It's planned for ${escapeHtml(r.quarter || "a future quarter")}.`;
    else if (r.status === "new") statusClause = "It hasn't been started.";
    return (sentence ? sentence + " " : "") + statusClause;
  }
  function thenReason(r){
    const bits = [];
    if (r.dueDate) bits.push(dueLabel(r.dueDate));
    else bits.push(r.customers.length ? `${r.customers.length} customer${r.customers.length===1?"":"s"}` : null);
    if (r.status === "new") bits.push("not started");
    else if (r.status === "planned") bits.push("planned");
    if (!r.dueDate && !bits.filter(Boolean).length) bits.push("no due date");
    return bits.filter(Boolean).join(", ");
  }
  function renderNowScreen(){
    const open = state.requests.filter(r => !isShipped(r)).sort((a,b) => scoreOf(b) - scoreOf(a));
    if (open.length === 0){
      const clusters = clusterUnmatchedQuestions();
      return `<div class="screen-empty">Nothing open right now.${clusters.length ? ` There ${clusters.length===1?"is":"are"} <span class="src" data-nav-go="trends">${clusters.length} recurring theme${clusters.length===1?"":"s"} in Trends</span> worth a look.` : ""}</div>`;
    }
    const top = open[0];
    const then = open.slice(1, 4);
    const clusters = clusterUnmatchedQuestions();
    const topCluster = clusters[0];
    const topClusterCustCount = topCluster ? (new Set(topCluster.items.map(q => parseCustomerFromText(q.text)).filter(Boolean)).size || 1) : 0;
    const linkedQ = state.questions.filter(q => q.matchedRequestId === top.id).sort((a,b) => b.createdAt - a.createdAt);
    const mostRecentQ = linkedQ[0];

    return `
      <div class="now-screen">
        <div class="now-left">
          <div class="eyebrow" style="color:var(--teal);">Work on this now</div>
          <h1 class="now-title">${escapeHtml(top.title)}</h1>
          <div class="now-reason">${reasonSentence(top)}</div>
          ${top.description ? `<div class="now-what-it-is">
            <div class="eyebrow" style="color:var(--ink-faint);">What it is</div>
            <div class="now-description" id="nowDescription">${escapeHtml(top.description)}</div>
            <button class="now-desc-more" id="nowDescMore" style="display:none;">Show more</button>
          </div>` : ""}
          ${top.customers.length ? `<div class="now-chips">${top.customers.map(c => `<span class="plain-chip">${escapeHtml(c)}</span>`).join("")}</div>` : ""}
          ${mostRecentQ ? `<div class="now-answered-card">
            <div class="label">Most recent question it answered</div>
            <div class="quote">"${escapeHtml(mostRecentQ.text)}"</div>
            <div class="mono-meta">${escapeHtml(parseCustomerFromText(mostRecentQ.text) || "")}${parseCustomerFromText(mostRecentQ.text) ? " · " : ""}${ageLabel(mostRecentQ.createdAt)}</div>
          </div>` : ""}
          <div class="now-actions">
            <button class="btn-primary" data-open-req="${top.id}">Open request</button>
            <button class="btn-secondary" data-mark-shipped="${top.id}">Mark shipped</button>
            <button class="btn-link" data-nav-go="requests">Why not something else?</button>
          </div>
        </div>
        <div class="now-right">
          ${then.length ? `<div>
            <div class="eyebrow" style="color:var(--ink-soft);margin-bottom:10px;">Then</div>
            <div class="then-list">
              ${then.map((r,i) => `<div class="then-row">
                <div class="then-rank">${i+2}</div>
                <div><div class="then-title" data-open-req="${r.id}">${escapeHtml(r.title)}</div><div class="then-reason">${escapeHtml(thenReason(r))}</div></div>
              </div>`).join("")}
            </div>
          </div>` : ""}
          ${topCluster ? `<div>
            <div class="eyebrow" style="color:var(--ochre);margin-bottom:10px;">Asked for, but not tracked</div>
            <div class="theme-card">
              <div class="theme-title">${escapeHtml(clusterLabel(topCluster))}</div>
              <div class="theme-sub">${topCluster.items.length} similar question${topCluster.items.length===1?"":"s"} from ${topClusterCustCount} customer${topClusterCustCount===1?"":"s"}, with no request yet</div>
              <button class="theme-cta" data-raise-cluster-idx="0">Raise as request →</button>
            </div>
          </div>` : ""}
        </div>
      </div>`;
  }

  // =====================================================================
  //  Answer screen (1b) + quarter/entity list answer (2a)
  // =====================================================================
  function pushRecentAsk(entry){
    state.feed.push(entry);
    if (state.feed.length > 30) state.feed.shift();
  }
  function submitAsk(rawText){
    const text = rawText.trim();
    if (!text) return;
    document.getElementById("askInput").value = "";

    // Quarter lookup and customer/topic entity lookup both produce a "list"
    // answer — grouped cards, never a fuzzy match (see docs/DESIGN.md).
    const qMatch = matchQuarterQuery(text);
    const entityMatches = matchEntities(text);
    if (qMatch || entityMatches.customers.length || entityMatches.tags.length){
      const answer = qMatch ? buildQuarterAnswer(text, qMatch) : buildEntityAnswer(text, entityMatches);

  function ordinalOf(n){

  function buildQuarterAnswer(text, qMatch){

    const openReqs = state.requests.filter(r => !isShipped(r));
    const groupsByQuarter = {};
    openReqs.forEach(r => { const k = r.quarter || "Unscheduled"; (groupsByQuarter[k] = groupsByQuarter[k] || []).push(r); });

    // parseQuarterSort() gives unscheduled-like values a negative sort key,
    // which is right for knownQuarters()'s own ascending order but wrong
    // here, where the undated bucket reads as a trailing "everything else".
    let orderedKeys = quarters.filter(k => groupsByQuarter[k]);
    if (groupsByQuarter["Unscheduled"] && !orderedKeys.includes("Unscheduled")) orderedKeys.push("Unscheduled");
    orderedKeys = orderedKeys.filter(k => parseQuarterSort(k) >= 0).concat(orderedKeys.filter(k => parseQuarterSort(k) < 0));
    const cards = orderedKeys.map(k => {
      const items = groupsByQuarter[k];
      const isUnsched = k === "Unscheduled" || !parseQuarterSort(k) || parseQuarterSort(k) < 0;
      let headMeta = null, headMetaCls = "";
      const endsSoon = quarterEndsWithinDays(k, 14);
      if (isUnsched) { headMeta = "not scheduled"; headMetaCls = "faint"; }
      else if (endsSoon !== null && endsSoon <= 14 && endsSoon >= 0) { headMeta = `ends in ${endsSoon} day${endsSoon===1?"":"s"}`; headMetaCls = "warn"; }
      else { const starts = quarterStartsLabel(k); headMeta = starts || ""; }
      const notStarted = items.filter(r => r.status === "new").length;
      let footer = null;
      if (!isUnsched && endsSoon !== null && endsSoon >= 0 && endsSoon <= 14 && notStarted > 0){
        footer = `${notStarted} of ${items.length} not started, with ${endsSoon} day${endsSoon===1?"":"s"} left in the quarter`;
      }
      return {
        title: k, dashed: isUnsched, muted: isUnsched, headMeta, headMetaCls,
        rows: items.map(r => ({ id: r.id, title: r.title, sub: `${statusLabel(r.status)} · ${r.customers.length} customer${r.customers.length===1?"":"s"}`, subColor: statusColor(r.status) })),

      kind: "list", listType: "quarter", text,
      filter: qMatch && qMatch.focus ? { type: "quarter", value: qMatch.focus } : null,
      title: "Here's what's planned, by quarter.",
      meta: `matched "quarter" · all ${openReqs.length} open request${openReqs.length===1?"":"s"}${shippedHidden ? ` · ${shippedHidden} shipped request${shippedHidden===1?"":"s"} hidden` : ""}`,

    return { start, end };

  function buildEntityAnswer(text, matches){

      const meta = rc.group === "quarter" ? groupMeta(rc.group, g.key, g.items) : { text: "", color: "" };
      const count = byCustomer ? `${g.items.length} request${g.items.length===1?"":"s"}` : g.items.length;
      const similar = byCustomer && g.key !== null ? (dupHints.get(g.key) || []) : [];
      const hint = similar.length
        ? `<div class="g-hint">"${escapeHtml(similar[0])}"${similar.length > 1 ? ` and ${similar.length - 1} more` : ""} may be the same customer <button class="g-link" data-merge-customer="${escapeHtml(g.key)}">Merge</button></div>` : "";
      const actions = byCustomer && g.key !== null ? `<div class="g-actions">${hint}<button class="g-link" data-edit-customer="${escapeHtml(g.key)}">Edit</button></div>` : "";
      return `<div>
        <div class="req-group-head${g.noCustomer ? " no-customer" : ""}">
          <div class="g-name">${escapeHtml(groupLabel(rc.group, g.key))}</div>
          <div class="mono-meta">${count}</div>
          ${meta.text ? `<div class="g-meta" style="color:${meta.color};">${meta.text}</div>` : ""}
          ${actions}
        </div>
        ${g.items.map(r => renderRequestRow(r, rc.layout, maxTotal, byCustomer ? { customer: g.key } : null)).join("")}
      </div>`;
    }).join("")}</div>`;

    // Only claim the counts overlap if some request really is listed twice.
    const note = byCustomer
      ? `<div class="req-note">Customers with the most requests come first.${visible.some(r => new Set(r.customers).size > 1) ? " Group counts add up to more than the number of requests, because a shared request is listed once per customer." : ""}</div>` : "";

    return toolbar + legend + body + note;
  }
  // ctx (Group by Customer only): { customer } is the group's customer, so the
  // second line names the request's *other* customers, or "only" this one.
  function renderRequestRow(r, layout, maxTotal, ctx){
    const dueTxt = r.dueDate ? dueLabelFor(r) : "no due date";
    const dueSoon = isDueSoon(r);
    let custStr = r.customers.length > 2 ? `${r.customers.slice(0,2).join(", ")} +${r.customers.length-2}` : r.customers.join(", ");
    let custClass = "r-customers";
    if (ctx && ctx.customer !== null && ctx.customer !== undefined){
      const others = r.customers.filter(c => c !== ctx.customer);
      if (others.length) custStr = "also " + others.join(", ");
      else { custStr = "only " + ctx.customer; custClass += " only"; }
    }
    let midCol;
    if (layout === "ledger"){
      const parts = scorePartsArray(r);
      midCol = `<div class="r-ledger-bar">${parts.map(p => `<div class="seg" style="width:${Math.max(0,(p.val/maxTotal*100))}%;background:${p.color};" title="${escapeHtml(p.label)}"></div>`).join("")}</div>`;
    } else {
      midCol = `<div class="r-list-cols">
        <div class="col-status" style="color:${statusColor(r.status)};">${escapeHtml(statusLabel(r.status))}</div>
        <div class="col-urgency">${escapeHtml(r.urgency ? r.urgency.charAt(0).toUpperCase()+r.urgency.slice(1) : "—")}</div>
        <div class="col-topic">${escapeHtml(r.topic ? r.topic.charAt(0).toUpperCase()+r.topic.slice(1) : "—")}</div>
        <div>${r.questionCount} question${r.questionCount===1?"":"s"}</div>
      </div>`;
    }
    return `<div class="req-row" data-open-req="${r.id}">
      <div class="r-main"><div class="r-title">${escapeHtml(r.title)}</div><div class="${custClass}">${escapeHtml(custStr) || "no customers logged"}</div></div>
      ${midCol}
      <div class="r-due${dueSoon?" soon":""}">${escapeHtml(dueTxt)}</div>
    </div>`;
  }

  function wireRequestModal(r, id, showCount, linkedQ){
    const modal = document.getElementById("detailModal");
    modal.querySelectorAll("[data-close]").forEach(el => el.onclick = () => { closeOverlay("detailOverlay"); modal.classList.remove("req-modal"); render(); });
    const manageLink = modal.querySelector("#manageStatusesLink");
    if (manageLink) manageLink.onclick = () => openManageStatuses();
    const manageTopicsLink = modal.querySelector("#manageTopicsLink");
    if (manageTopicsLink) manageTopicsLink.onclick = () => openManageTopics();
    modal.querySelector("#adjustWeightsBtn").onclick = () => openWeightsOverlay();

    const titleEl = document.getElementById("editTitle");
    const descEl = document.getElementById("editDescription");
    // Plain textareas don't grow with their content on their own — without
    // this, a multi-line description is clipped to min-height and the only
    // way to read the rest is dragging the resize handle. Auto-size on open
    // and on every keystroke instead, same pattern any auto-growing textarea
    // uses: collapse to measure the real scrollHeight, then expand to it.
    function autosize(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
    // The modal is still `display: none` at this point (openOverlay() runs
    // right after this function returns), so scrollHeight would measure a
    // hidden, unlaid-out box and come back wrong. Defer to the next frame,
    // once the overlay is actually visible.
    requestAnimationFrame(() => autosize(descEl));
    descEl.addEventListener("input", () => autosize(descEl));
    titleEl.addEventListener("blur", () => {
      const val = titleEl.value.trim() || "Untitled request";
      if (val !== r.title){ r.title = val; r.updatedAt = Date.now(); saveState(); }
    });
    descEl.addEventListener("blur", () => {
      const val = descEl.value.trim();
      if (val !== r.description){ r.description = val; r.updatedAt = Date.now(); saveState(); }
    });

    function fieldCommitter(field, allowEmpty){
      return (val, isNew) => {
        r[field] = (allowEmpty && val === "") ? null : val;
        r.updatedAt = Date.now(); saveState();
        openRequestDetail(id);
      };
    }
    wireAddableSelect(document.getElementById("editStatus"), document.getElementById("newStatusInput"), (val, isNew) => {
      const wasShipped = isShipped(r);
      r.status = val; r.updatedAt = Date.now();
      if (isShipped(r) && !wasShipped) r.shippedAt = Date.now();
      if (!isShipped(r)) r.shippedAt = null;
      saveState(); openRequestDetail(id);
    });
    wireAddableSelect(document.getElementById("editQuarter"), document.getElementById("newQuarterInput"), fieldCommitter("quarter", false));
    wireAddableSelect(document.getElementById("editTopic"), document.getElementById("newTopicInput"), fieldCommitter("topic", true));
    document.getElementById("editUrgency").onchange = () => { r.urgency = document.getElementById("editUrgency").value; r.updatedAt = Date.now(); saveState(); openRequestDetail(id); };
    document.getElementById("editDueDate").onchange = (e) => {
      r.dueDate = e.target.value ? new Date(e.target.value + "T00:00:00").getTime() : null;
      r.updatedAt = Date.now(); saveState(); openRequestDetail(id);
    };

    // Customers autosave like the other fields. The modal re-renders after each
    // change (score, rank and counts all depend on it), so keep typing focus by
    // re-focusing the new input, except when the change came from clicking away.
    const custInput = createCustomerInput(document.getElementById("customerChips"), {
      values: r.customers, commitOnBlur: true, placeholder: "Add a customer…",
      onChange: (list, meta) => {
        r.customers = list.slice(); r.updatedAt = Date.now(); saveState();
        refocusCustomerInput = !meta.viaBlur;
        openRequestDetail(id);
      },
    });
    // Focus has to wait until the overlay is reopened (openRequestDetail closes it while it re-renders).
    pendingCustomerInput = refocusCustomerInput ? custInput : null;
    refocusCustomerInput = false;

    const showMore = document.getElementById("showMoreLinkedQ");
    if (showMore) showMore.onclick = () => {
      const container = showMore.parentElement;
      const rest = linkedQ.slice(showCount);
      showMore.insertAdjacentHTML("beforebegin", rest.map(q => `<div class="linked-q-row"><div>"${escapeHtml(q.text)}"</div><div class="meta">${escapeHtml(parseCustomerFromText(q.text)||"")}${parseCustomerFromText(q.text)?" · ":""}${ageLabel(q.createdAt)}</div></div>`).join(""));
      showMore.remove();
    };

    const shipBtn = modal.querySelector("#markShipped");
    if (shipBtn) shipBtn.onclick = () => { r.status = "shipped"; r.shippedAt = Date.now(); r.updatedAt = Date.now(); saveState(); openRequestDetail(id); };
    modal.querySelector("#deleteRequestBtn").onclick = () => {
      if (!confirm(`Permanently delete "${r.title}"? This can't be undone. Its ${linkedQ.length} linked question${linkedQ.length===1?"":"s"} will stay logged but unlinked.`)) return;
      state.requests = state.requests.filter(x => x.id !== id);
      state.questions.forEach(q => { if (q.matchedRequestId === id) q.matchedRequestId = null; });
      saveState(); closeOverlay("detailOverlay"); modal.classList.remove("req-modal"); render();
    };
  }

  // ---------------- Priority weights (unchanged) ----------------
  function openWeightsOverlay(){
    const w = state.scoreWeights;
    const modal = document.getElementById("detailModal");

    modal.innerHTML = `
      <button class="close-x" data-close="detailOverlay">&#10005;</button>

      <div class="modal-sub">New, Planned, In progress and Shipped are built in and can't be changed here. Anything else you've added via "+ Add new" can be fixed or removed below.</div>
      ${customs.length ? customs.map(s => {

        return `<div class="field-row" style="align-items:flex-start;">
          <div class="field" style="flex:1;">
            <input type="text" data-rename-status="${escapeHtml(s)}" value="${escapeHtml(s)}" />
            <div class="badge" style="margin-top:4px;">${count} request${count===1?"":"s"} using this</div>
          </div>
          <button class="btn btn-danger" data-delete-status="${escapeHtml(s)}" style="margin-top:2px;">Delete</button>
        </div>`;
      }).join("") : `<div class="badge">No custom statuses in use.</div>`}
      <div class="modal-actions"><button class="btn-primary" id="closeManageStatuses">Done</button></div>`;
    modal.querySelector("[data-close]").onclick = () => { closeOverlay("detailOverlay"); render(); };
    modal.querySelector("#closeManageStatuses").onclick = () => { closeOverlay("detailOverlay"); render(); };
    modal.querySelectorAll("[data-rename-status]").forEach(input => {
      const commit = () => {
        const oldVal = input.getAttribute("data-rename-status");
        const newVal = input.value.trim();
        if (!newVal || newVal === oldVal) { input.value = oldVal; return; }
        state.requests.forEach(r => { if (r.status === oldVal) { r.status = newVal; r.updatedAt = Date.now(); } });
        saveState(); openManageStatuses();
      };
      input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); commit(); } });
      input.addEventListener("blur", commit);
    });
    modal.querySelectorAll("[data-delete-status]").forEach(btn => {
      btn.onclick = () => {
        const val = btn.getAttribute("data-delete-status");
        const count = state.requests.filter(r => r.status === val).length;
        if (!confirm(`Delete status "${val}"? ${count} request${count===1?"":"s"} using it will move back to "New".`)) return;
        state.requests.forEach(r => { if (r.status === val) { r.status = "new"; r.updatedAt = Date.now(); } });
        saveState(); openManageStatuses();
      };
    });
    openOverlay("detailOverlay");
  }
  function openManageTopics(){
    const modal = document.getElementById("detailModal");
    modal.classList.remove("req-modal");
    const customs = customTopics();
    modal.innerHTML = `
      <button class="close-x" data-close="detailOverlay">&#10005;</button>
      <h2>Manage topics</h2>
      <div class="modal-sub">Every topic currently in use is listed here. Renaming one rewrites it on every request that has it; deleting one clears those requests back to "None".</div>
      ${customs.length ? customs.map(t => {
        const count = state.requests.filter(r => r.topic === t).length;
        return `<div class="field-row" style="align-items:flex-start;">
          <div class="field" style="flex:1;">
            <input type="text" data-rename-topic="${escapeHtml(t)}" value="${escapeHtml(t)}" />
            <div class="badge" style="margin-top:4px;">${count} request${count===1?"":"s"} using this</div>
          </div>
          <button class="btn btn-danger" data-delete-topic="${escapeHtml(t)}" style="margin-top:2px;">Delete</button>
        </div>`;
      }).join("") : `<div class="badge">No topics in use.</div>`}
      <div class="modal-actions"><button class="btn-primary" id="closeManageTopics">Done</button></div>`;
    modal.querySelector("[data-close]").onclick = () => { closeOverlay("detailOverlay"); render(); };
    modal.querySelector("#closeManageTopics").onclick = () => { closeOverlay("detailOverlay"); render(); };
    modal.querySelectorAll("[data-rename-topic]").forEach(input => {
      const commit = () => {
        const oldVal = input.getAttribute("data-rename-topic");
        const newVal = input.value.trim();
        if (!newVal || newVal === oldVal) { input.value = oldVal; return; }
        state.requests.forEach(r => { if (r.topic === oldVal) { r.topic = newVal; r.updatedAt = Date.now(); } });
        saveState(); openManageTopics();
      };
      input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); commit(); } });
      input.addEventListener("blur", commit);
    });
    modal.querySelectorAll("[data-delete-topic]").forEach(btn => {
      btn.onclick = () => {
        const val = btn.getAttribute("data-delete-topic");
        const count = state.requests.filter(r => r.topic === val).length;
        if (!confirm(`Delete topic "${val}"? ${count} request${count===1?"":"s"} using it will move back to "None".`)) return;
        state.requests.forEach(r => { if (r.topic === val) { r.topic = null; r.updatedAt = Date.now(); } });
        saveState(); openManageTopics();
      };
    });
    openOverlay("detailOverlay");
  }

  // =====================================================================
  //  Draft (new feature request) overlay — unchanged mechanics
  // =====================================================================
  let pendingTags = [];
  // Set when a draft is opened from the Answer screen's "Raise a new request
  // instead" link (State A) — moves the original question from the wrong
  // match onto the new request, same as before.
  let pendingDraftFeedItem = null;
  // Set when a draft is opened from a theme/cluster ("Raise request") or from
  // "Raise it" (State C, a single question) — every question id here
  // gets linked to the newly created request on save.
  let pendingDraftClusterQuestionIds = null;

  let refocusCustomerInput = false; // set by the request modal's customer input, read after its re-render
  let pendingCustomerInput = null;  // the new modal's customer input, focused once the overlay is open again
  const draftCustomers = createCustomerInput(document.getElementById("dCustomers"), { commitOnBlur: true });

  function openDraftFromText(text){
    const cleaned = text.replace(/^raise (a )?(new )?feature request( for)?[:]?/i, "").trim();
    const firstSentenceEnd = cleaned.search(/[.!?]/);
    const title = (firstSentenceEnd > 0 ? cleaned.slice(0, firstSentenceEnd) : cleaned).slice(0,80);
    document.getElementById("dTitle").value = title.charAt(0).toUpperCase()+title.slice(1);
    document.getElementById("dDesc").value = cleaned;
    draftCustomers.setValues(extractCustomers(cleaned));
    pendingTags = suggestTags(cleaned);
    renderDraftTags();
    openOverlay("draftOverlay");
  }
  function renderDraftTags(){
    const el = document.getElementById("dTags");
    if (pendingTags.length === 0){ el.innerHTML = `<span class="badge">No suggestions — add tags after saving.</span>`; return; }
    el.innerHTML = pendingTags.map((t,i) => {
      if (t.state === "accepted"){
        const cls = t.type === "urgency" ? `urgency-${t.value}` : "topic";
        return `<span class="chip ${cls}">${t.type}: ${t.value} <span class="reject" data-i="${i}" data-a="unaccept" title="Undo">&#10005;</span></span>`;
      }
      return `<span class="chip suggested" title="${t.reason||''}">${t.type}: ${t.value}
        <span class="accept" data-i="${i}" data-a="keep" title="Accept">&#10003;</span>
        <span class="reject" data-i="${i}" data-a="drop" title="Reject">&#10005;</span></span>`;
    }).join("");
    el.querySelectorAll("[data-a]").forEach(s => {
      s.onclick = () => {
        const i = +s.getAttribute("data-i");
        const action = s.getAttribute("data-a");
        if (action === "keep") pendingTags[i].state = "accepted";
        else if (action === "unaccept") pendingTags[i].state = "suggested";
        else pendingTags.splice(i,1);
        renderDraftTags();
      };
    });
  }
  document.getElementById("discardDraft").onclick = () => {
    document.getElementById("dTitle").value = ""; document.getElementById("dDesc").value = ""; draftCustomers.setValues([]);
    pendingTags = []; renderDraftTags(); pendingDraftFeedItem = null; pendingDraftClusterQuestionIds = null;
    closeOverlay("draftOverlay");
  };
  document.getElementById("saveDraft").onclick = () => {
    const title = document.getElementById("dTitle").value.trim() || "Untitled request";
    const description = document.getElementById("dDesc").value.trim();
    draftCustomers.commitPending();
    const customers = draftCustomers.getValues();
    const urgencyTag = pendingTags.find(t => t.type === "urgency");
    const urgency = urgencyTag ? urgencyTag.value : "medium";
    const topicTag = pendingTags.find(t => t.type === "topic");
    const topic = topicTag ? topicTag.value : null;
    const now = Date.now();
    const req = { id: uid("req"), title, description, customers, urgency, topic, status: "new", quarter: "Unscheduled", dueDate: null, createdAt: now, updatedAt: now, questionCount: 0, shippedAt: null };
    state.requests.push(req);
    if (pendingDraftFeedItem && pendingDraftFeedItem.matchedRequestId){
      const origQ = state.questions.find(x => x.id === pendingDraftFeedItem.questionId);
      if (origQ) origQ.matchedRequestId = req.id;
      req.questionCount += 1;
      pendingDraftFeedItem = null;
    }
    if (pendingDraftClusterQuestionIds){
      pendingDraftClusterQuestionIds.forEach(qid => {
        const qq = state.questions.find(x => x.id === qid);
        if (qq && !qq.matchedRequestId){ qq.matchedRequestId = req.id; req.questionCount += 1; }
      });
      pendingDraftClusterQuestionIds = null;
    }
    saveState();
    document.getElementById("dTitle").value = ""; document.getElementById("dDesc").value = ""; draftCustomers.setValues([]);
    pendingTags = []; renderDraftTags();
    closeOverlay("draftOverlay");
    // Stay on the screen the request was raised from. The Ask screen is the one
    // exception: its answer card is about the question that was just turned
    // into a request, so leaving it up would offer to raise it twice.
    if (state.activeScreen === "answer"){ state.activeScreen = "now"; state.currentAnswer = null; }
    render();
  };

  document.querySelectorAll(".overlay").forEach(ov => {
    let downOnBackdrop = false;
    ov.addEventListener("mousedown", e => { downOnBackdrop = (e.target === ov); });
    ov.addEventListener("click", e => { if (e.target === ov && downOnBackdrop){ closeOverlay(ov.id); if (ov.id === "detailOverlay"){ document.getElementById("detailModal").classList.remove("req-modal"); render(); } } downOnBackdrop = false; });
  });
  document.querySelectorAll("[data-close]").forEach(el => { el.onclick = () => closeOverlay(el.getAttribute("data-close")); });
  function openOverlay(id){ document.getElementById(id).classList.add("open"); }
  function closeOverlay(id){ document.getElementById(id).classList.remove("open"); }

  // =====================================================================
  //  Screen-level event wiring (delegated per render() call)
  // =====================================================================
  let viewsMenuOpen = false;
  function wireScreenInteractions(){
    mainEl.querySelectorAll("[data-open-req]").forEach(el => { el.onclick = () => openRequestDetail(el.getAttribute("data-open-req")); });
    mainEl.querySelectorAll("[data-go-req]").forEach(el => { el.onclick = () => openRequestDetail(el.getAttribute("data-go-req")); });
    mainEl.querySelectorAll("[data-nav-go]").forEach(el => { el.onclick = () => { state.activeScreen = el.getAttribute("data-nav-go"); state.currentAnswer = null; render(); }; });
    mainEl.querySelectorAll("[data-mark-shipped]").forEach(el => { el.onclick = () => {
      const r = state.requests.find(x => x.id === el.getAttribute("data-mark-shipped"));
      if (r){ r.status = "shipped"; r.shippedAt = Date.now(); r.updatedAt = Date.now(); saveState(); render(); }
    }; });
    mainEl.querySelectorAll("[data-go-cust]").forEach(el => { el.onclick = () => submitAsk(el.getAttribute("data-go-cust")); });

    // Now screen: "Show more" only appears when the description actually
    // overflows its 2-line clamp — a short description shows in full with
    // no link at all.
    const nowDesc = document.getElementById("nowDescription");
    const nowDescMore = document.getElementById("nowDescMore");
    if (nowDesc && nowDescMore){
      if (nowDesc.scrollHeight > nowDesc.clientHeight + 1) nowDescMore.style.display = "";
      nowDescMore.onclick = () => { nowDesc.classList.add("expanded"); nowDescMore.remove(); };
    }
    mainEl.querySelectorAll("[data-quick-ask]").forEach(el => { el.onclick = () => submitAsk(el.getAttribute("data-quick-ask")); });

    // Now / Trends: raise a request from an unmatched-question cluster.
    mainEl.querySelectorAll("[data-raise-cluster-idx]").forEach(el => {
      el.onclick = () => {
        const idx = +el.getAttribute("data-raise-cluster-idx");
        const clusters = clusterUnmatchedQuestions();
        const c = clusters[idx];
        if (!c) return;
        pendingDraftFeedItem = null;
        pendingDraftClusterQuestionIds = c.items.map(q => q.id);
        openDraftFromText("Raise a feature request for: " + clusterLabel(c));
      };
    });

    // Answer screen actions
    const countBtn = mainEl.querySelector("[data-count-ask]");
    if (countBtn) countBtn.onclick = () => {
      const a = state.currentAnswer;
      const r = state.requests.find(x => x.id === a.requestId);
      const q = state.questions.find(x => x.id === a.questionId);
      if (r && q && !q.matchedRequestId){
        q.matchedRequestId = r.id; r.questionCount += 1;
        if (a.customer && !a.alreadyCustomer && !r.customers.some(c => c.toLowerCase() === a.customer.toLowerCase())) r.customers.push(a.customer);
        r.updatedAt = Date.now();
        a.counted = true;
        saveState(); render();
      }
    };
    const raiseInstead = mainEl.querySelector("[data-raise-instead]");
    if (raiseInstead) raiseInstead.onclick = () => {
      const a = state.currentAnswer;
      pendingDraftClusterQuestionIds = null;
      pendingDraftFeedItem = { matchedRequestId: a.requestId, questionId: a.questionId };
      openDraftFromText(a.text);
    };
    const raiseTheme = mainEl.querySelector("[data-raise-theme]");
    if (raiseTheme) raiseTheme.onclick = () => {
      const a = state.currentAnswer;
      pendingDraftFeedItem = null;
      pendingDraftClusterQuestionIds = a.clusterQuestionIds;
      openDraftFromText("Raise a feature request for: " + a.label);
    };
    const raiseFirst = mainEl.querySelector("[data-raise-first]");
    if (raiseFirst) raiseFirst.onclick = () => {
      const a = state.currentAnswer;
      pendingDraftFeedItem = null;
      pendingDraftClusterQuestionIds = [a.questionId];
      openDraftFromText(a.text);
    };
    const rephrase = mainEl.querySelector("[data-rephrase]");
    if (rephrase) rephrase.onclick = () => {
      state.activeScreen = "now"; state.currentAnswer = null; render();
      const input = document.getElementById("askInput");
      input.value = state.currentAnswer ? "" : "";
      input.focus();
    };

    // Requests screen controls
    mainEl.querySelectorAll("[data-edit-customer]").forEach(b => { b.onclick = e => { e.stopPropagation(); openCustomerDialog(b.getAttribute("data-edit-customer")); }; });
    mainEl.querySelectorAll("[data-merge-customer]").forEach(b => { b.onclick = e => {
      e.stopPropagation();
      const n = b.getAttribute("data-merge-customer");
      openCustomerDialog(n, customerDuplicateHints().get(n) || []);
    }; });
    mainEl.querySelectorAll('[data-seg="group"] button').forEach(b => { b.onclick = () => { state.requestsControls.group = b.getAttribute("data-val"); saveState(); render(); }; });
    mainEl.querySelectorAll('[data-seg="layout"] button').forEach(b => { b.onclick = () => { state.requestsControls.layout = b.getAttribute("data-val"); saveState(); render(); }; });
    const shipSel = mainEl.querySelector("#shippedFilterSelect");
    if (shipSel) shipSel.onchange = () => { state.requestsControls.shippedFilter = shipSel.value; saveState(); render(); };
    const clearFilter = mainEl.querySelector("[data-clear-filter]");
    if (clearFilter) clearFilter.onclick = () => { state.requestsControls.filter = null; saveState(); render(); };
    const newReqBtn = mainEl.querySelector("#newRequestBtn");
    if (newReqBtn) newReqBtn.onclick = () => { pendingDraftFeedItem = null; pendingDraftClusterQuestionIds = null; openDraftFromText(""); };
    const viewsBtn = mainEl.querySelector("#viewsMenuBtn");
    const viewsList = mainEl.querySelector("#viewsMenuList");
    if (viewsBtn) viewsBtn.onclick = (e) => { e.stopPropagation(); viewsList.classList.toggle("open"); };
    document.addEventListener("click", () => { if (viewsList) viewsList.classList.remove("open"); }, { once: true });
    mainEl.querySelectorAll("[data-load-view]").forEach(b => {
      b.onclick = (e) => {
        if (e.target.closest("[data-del-view]")) return;
        const v = state.views.find(x => x.id === b.getAttribute("data-load-view"));
        if (v){ state.requestsControls = { group: v.group, layout: v.layout, shippedFilter: v.shippedFilter, filter: v.filter || null }; saveState(); render(); }
      };
    });
    mainEl.querySelectorAll("[data-del-view]").forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); state.views = state.views.filter(v => v.id !== b.getAttribute("data-del-view")); saveState(); render(); };
    });
    const saveViewOpen = mainEl.querySelector("[data-save-view-open]");
    if (saveViewOpen) saveViewOpen.onclick = () => { saveViewFromAnswer = null; openOverlay("viewOverlay"); };
    // From a customer/topic/quarter answer page: the view remembers that filter,
    // and shows shipped requests too, since the answer page lists them.
    const saveViewBtn2 = mainEl.querySelector("[data-save-view]");
    if (saveViewBtn2) saveViewBtn2.onclick = () => { saveViewFromAnswer = { filter: (state.currentAnswer && state.currentAnswer.filter) || null }; openOverlay("viewOverlay"); };
  }
  let saveViewFromAnswer = null;
  document.getElementById("saveView").onclick = () => {
    const name = document.getElementById("vName").value.trim();
    if (!name) { document.getElementById("vName").focus(); return; }
    const fromAnswer = saveViewFromAnswer;
    const v = { id: uid("v"), name, group: state.requestsControls.group, layout: state.requestsControls.layout,
      shippedFilter: fromAnswer ? (fromAnswer.filter ? "all" : state.requestsControls.shippedFilter) : state.requestsControls.shippedFilter,
      filter: fromAnswer ? fromAnswer.filter : (state.requestsControls.filter || null), builtin: false };
    saveViewFromAnswer = null;
    state.views.push(v); saveState();
    closeOverlay("viewOverlay"); document.getElementById("vName").value = "";
    render();
  };

  // ---------------- Ask box wiring ----------------
  const askBox = document.getElementById("askBox");
  const askInput = document.getElementById("askInput");
  function syncAskBoxStyle(){ askBox.classList.toggle("has-content", askInput.value.trim().length > 0); }
  askInput.addEventListener("input", syncAskBoxStyle);
  askInput.addEventListener("focus", () => askBox.classList.add("focused"));
  askInput.addEventListener("blur", () => askBox.classList.remove("focused"));
  askInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); submitAsk(askInput.value); syncAskBoxStyle(); }
  });

  applyTheme();
  const themeSelect = document.getElementById("themeSelect");
  themeSelect.value = state.theme;
  themeSelect.onchange = () => { state.theme = themeSelect.value; saveState(); applyTheme(); };

  render();
})();
</script>
</body>
</html>
