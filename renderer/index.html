<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self';">
<title>Question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     Design tokens. Colours are unchanged from the previous version of this
     app (see git history) — only typography and a handful of new
     supporting tokens (body copy, row dividers, segmented-control track,
     ochre/rust text variants, strip borders) were added for the "What
     should I work on now?" redesign. See docs/DESIGN.md for the choices
     this build must not casually undo, and the handover README for the
     full spec this file implements screen-by-screen. */
  :root {
    --paper: #F5F2EA;
    --paper-raised: #FBF9F4;
    --ink: #24261F;
    --ink-soft: #6B6858;
    --ink-faint: #9A9686;
    --teal: #1F6F64;
    --teal-soft: #E4EFEC;
    --ochre: #B4762A;
    --ochre-soft: #F3E8D8;
    --rust: #A9432E;
    --rust-soft: #F5E4E0;
    --rule: #DAD5C3;
    --rule-strong: #C7C1AC;
    --shadow: rgba(36, 38, 31, 0.08);
    --shadow-modal: rgba(36, 38, 31, 0.35);
    --body-copy: #4A4A3E;
    --row-divider: #EAE5D6;
    --segmented-track: #E6E1D3;
    --ochre-text-1: #8A5A1F;
    --ochre-text-2: #7A4E17;
    --ochre-text-3: #5E3E12;
    --ochre-text-4: #6B5A3A;
    --ochre-text-5: #9A7A4A;
    --teal-strip-border: #C9DED9;
    --ochre-strip-border: #E6D4B8;
    --rust-text: #8A3524;
    --font-display: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1D1E19; --paper-raised: #262720; --ink: #EDEAE0; --ink-soft: #A8A493; --ink-faint: #736F60;
      --teal: #4FA396; --teal-soft: #24322F; --ochre: #D69A4E; --ochre-soft: #34291A; --rust: #D9765F; --rust-soft: #362320;
      --rule: #3A3B32; --rule-strong: #4A4B40; --shadow: rgba(0, 0, 0, 0.3); --shadow-modal: rgba(0,0,0,.55); color-scheme: dark;
      --body-copy: #C7C3B2; --row-divider: #33342B; --segmented-track: #2E2F27;
      --ochre-text-1: #E3B37B; --ochre-text-2: #D9A468; --ochre-text-3: #F0C896; --ochre-text-4: #C9AE85; --ochre-text-5: #B79868;
      --teal-strip-border: #2E4842; --ochre-strip-border: #4A3A22; --rust-text: #E08868;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1D1E19; --paper-raised: #262720; --ink: #EDEAE0; --ink-soft: #A8A493; --ink-faint: #736F60;
    --teal: #4FA396; --teal-soft: #24322F; --ochre: #D69A4E; --ochre-soft: #34291A; --rust: #D9765F; --rust-soft: #362320;
    --rule: #3A3B32; --rule-strong: #4A4B40; --shadow: rgba(0, 0, 0, 0.3); --shadow-modal: rgba(0,0,0,.55); color-scheme: dark;
    --body-copy: #C7C3B2; --row-divider: #33342B; --segmented-track: #2E2F27;
    --ochre-text-1: #E3B37B; --ochre-text-2: #D9A468; --ochre-text-3: #F0C896; --ochre-text-4: #C9AE85; --ochre-text-5: #B79868;
    --teal-strip-border: #2E4842; --ochre-strip-border: #4A3A22; --rust-text: #E08868;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
  ::selection { background: var(--teal); color: var(--paper-raised); }

  /* ---------------- Global shell ---------------- */
  header { flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 20px 40px; border-bottom: 1px solid var(--rule); }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; flex-shrink: 0; }
  .ask-box { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 10px 14px; }
  .ask-box.has-content, .ask-box.focused { border: 1.5px solid var(--ink); padding: 9.5px 13.5px; }
  .ask-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
  .ask-box input { flex: 1; border: none; background: transparent; font-family: var(--font-body); font-size: 14px; color: var(--ink); padding: 0; }
  .ask-box input:focus { outline: none; }
  .ask-box input::placeholder { color: var(--ink-faint); }
  .header-spacer { flex: 1; }
  .main-nav { display: flex; align-items: center; gap: 20px; font-size: 13.5px; color: var(--ink-soft); flex-shrink: 0; }
  .main-nav button { font-family: var(--font-body); font-size: 13.5px; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  .main-nav button.active { color: var(--ink); font-weight: 600; }
  .main-nav button.ask-crumb { color: var(--ink); font-weight: 600; cursor: default; }
  #themeSelect { font-family: var(--font-body); font-size: 11.5px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink-soft); flex-shrink: 0; }

  main { flex: 1; overflow-y: auto; }
  .screen-empty { color: var(--ink-faint); font-size: 13px; padding: 60px 40px; text-align: center; }

  /* ---------------- Eyebrows / small type ---------------- */
  .eyebrow { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; }
  .mono-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
  .badge { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }

  /* ---------------- Now screen (1a) ---------------- */
  .now-screen { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); min-height: 100%; }
  .now-left { padding: 48px 48px 40px 40px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--rule); }
  .now-title { font-size: 56px; line-height: 1.02; font-weight: 600; letter-spacing: -0.03em; margin: 0; }
  .now-what-it-is .eyebrow { margin-bottom: 6px; }
  .now-description { font-size: 15px; line-height: 1.5; color: var(--ink-soft); max-width: 620px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now-description.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .now-desc-more { display: block; margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--teal); background: none; border: none; cursor: pointer; padding: 0; }
  .now-reason { font-size: 20px; line-height: 1.5; color: var(--body-copy); max-width: 620px; }
  .now-reason b { color: var(--ink); }
  .now-reason .due-soon { color: var(--rust); font-weight: 600; }
  .now-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .plain-chip { font-size: 13px; padding: 5px 10px; border-radius: 5px; background: var(--paper-raised); border: 1px solid var(--rule); }
  .now-answered-card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; max-width: 620px; }
  .now-answered-card .label { font-size: 13px; color: var(--ink-soft); }
  .now-answered-card .quote { font-size: 15.5px; }
  .now-actions { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn-primary { font-family: var(--font-body); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px; padding: 11px 18px; border-radius: 7px; border: none; cursor: pointer; }
  .btn-secondary { font-family: var(--font-body); border: 1px solid var(--rule-strong); background: transparent; color: var(--body-copy); font-weight: 600; font-size: 14px; padding: 11px 18px; border-radius: 7px; cursor: pointer; }
  .btn-link { font-family: var(--font-body); background: none; border: none; font-size: 14px; padding: 11px 8px; color: var(--ink-soft); cursor: pointer; }
  .btn-teal { font-family: var(--font-body); background: var(--teal); color: var(--paper-raised); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 7px; border: none; cursor: pointer; white-space: nowrap; }
  .btn-ochre { font-family: var(--font-body); background: var(--ochre); color: var(--paper-raised); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 7px; border: none; cursor: pointer; white-space: nowrap; }

  .now-right { padding: 48px 40px 40px; background: var(--paper-raised); display: flex; flex-direction: column; gap: 28px; }
  .then-list { display: flex; flex-direction: column; gap: 4px; }
  .then-row { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .then-list .then-row:last-child { border-bottom: 1px solid var(--rule); }
  .then-rank { font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint); padding-top: 2px; }
  .then-title { font-weight: 600; font-size: 15.5px; cursor: pointer; }
  .then-title:hover { text-decoration: underline; }
  .then-reason { font-size: 13.5px; color: var(--ink-soft); }

  .theme-card { border: 1px dashed var(--ochre); background: var(--ochre-soft); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .theme-card .theme-title { font-weight: 600; font-size: 15.5px; }
  .theme-card .theme-sub { font-size: 13.5px; color: var(--ochre-text-4); }
  .theme-cta { font-size: 13.5px; font-weight: 600; color: var(--ochre-text-1); background: none; border: none; padding: 0; margin-top: 4px; cursor: pointer; text-align: left; display: block; }

  /* ---------------- Answer screen (1b / 2a) ---------------- */
  .answer-screen { display: flex; flex-direction: column; align-items: center; padding: 36px 40px 60px; }
  .answer-col { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
  .answer-echo-wrap { display: flex; flex-direction: column; gap: 8px; }
  .answer-echo { display: flex; align-items: center; gap: 12px; background: var(--paper-raised); border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px 18px; }
  .answer-echo .q-text { flex: 1; font-size: 19px; }
  .answer-echo .who-chip { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; white-space: nowrap; }
  .answer-helper { font-size: 12.5px; color: var(--ink-faint); padding-left: 4px; }
  .answer-headline { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .answer-card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .answer-card-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .answer-card-body .row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .answer-card-body .title { font-size: 20px; font-weight: 600; }
  .answer-card-body .desc { font-size: 15px; color: var(--body-copy); }
  .answer-strip { display: flex; align-items: center; gap: 16px; padding: 16px 22px; }
  .answer-strip.teal { background: var(--teal-soft); border-top: 1px solid var(--teal-strip-border); color: var(--teal); }
  .answer-strip.ochre { background: var(--ochre-soft); border-top: 1px solid var(--ochre-strip-border); color: var(--ochre-text-2); }
  .answer-strip .strip-text { flex: 1; font-size: 14.5px; }
  .answer-similar-list { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
  .answer-similar-list .label { font-size: 13px; color: var(--ink-soft); }
  .answer-similar-row { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; }
  .first-ask-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .first-ask-body p { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--body-copy); }
  .not-what-meant { font-size: 14px; color: var(--ink-soft); }
  .not-what-meant a, .src { color: var(--teal); cursor: pointer; }
  .not-what-meant a:hover, .src:hover { text-decoration: underline; }

  .earlier-today { display: flex; flex-direction: column; margin-top: 10px; }
  .earlier-today .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); padding-bottom: 8px; }
  .earlier-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 14px; }
  .earlier-row .q { color: var(--body-copy); }
  .earlier-row .result { color: var(--ink-soft); }
  .earlier-row .result.linked { color: var(--teal); cursor: pointer; }
  .earlier-row .result.linked:hover { text-decoration: underline; }

  /* ---------------- Quarter / entity list answer (2a) ---------------- */
  .list-answer-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; padding: 40px 40px 0; }
  .list-answer-title { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .list-answer-actions { display: flex; gap: 10px; }
  .list-answer-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; align-items: start; padding: 24px 40px; }
  .lookup-card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .lookup-card.dashed { border: 1px dashed var(--rule-strong); }
  .lookup-card-head { padding: 16px 20px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
  .lookup-card.dashed .lookup-card-head { border-bottom-style: dashed; }
  .lookup-card-head .h-title { font-size: 18px; font-weight: 600; }
  .lookup-card-head .h-title.muted { color: var(--ink-soft); }
  .lookup-card-head .h-meta { font-size: 13px; color: var(--ink-soft); }
  .lookup-card-head .h-meta.warn { color: var(--rust); font-weight: 500; }
  .lookup-card-head .h-meta.faint { color: var(--ink-faint); }
  .lookup-row { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--row-divider); cursor: pointer; }
  .lookup-row:last-of-type { border-bottom: none; }
  .lookup-row:hover { background: var(--teal-soft); }
  .lookup-row .r-title { font-weight: 600; font-size: 15px; }
  .lookup-row .r-sub { font-size: 13px; }
  .lookup-card-footer { padding: 12px 20px; background: var(--rust-soft); font-size: 13px; color: var(--rust); }
  .other-ways { padding: 0 40px 32px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; margin-top: auto; }
  .other-ways .label { font-size: 13px; color: var(--ink-soft); }
  .other-ways-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .other-ways-chips button { font-family: var(--font-body); font-size: 13.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); cursor: pointer; }
  .other-ways-chips button:hover { border-color: var(--teal); }
  .list-answer-screen { display: flex; flex-direction: column; min-height: 100%; }

  /* ---------------- Requests screen (2b) ---------------- */
  .requests-toolbar { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 24px 40px 18px; }
  .requests-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-right: 8px; }
  .control-group { display: flex; align-items: center; gap: 10px; }
  .control-label { font-size: 13px; color: var(--ink-soft); }
  .segmented { display: flex; gap: 3px; background: var(--segmented-track); padding: 3px; border-radius: 7px; }
  .segmented button { font-family: var(--font-body); font-size: 13px; padding: 5px 11px; border-radius: 5px; cursor: pointer; font-weight: 500; background: transparent; border: none; color: var(--ink-soft); }
  .segmented button.active { background: var(--paper-raised); color: var(--ink); }
  .req-toolbar-spacer { flex: 1; }
  select.plain-select { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 10px; background: var(--paper); }
  .filter-bar { padding: 0 40px 14px; }
  .filter-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px 4px 10px; border-radius: 5px; background: var(--teal-soft); border: 1px solid var(--teal-strip-border); color: var(--teal); }
  .filter-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; padding: 0 3px; }
  .new-request-link { font-family: var(--font-body); font-size: 13px; color: var(--teal); font-weight: 600; background: none; border: none; cursor: pointer; }
  .views-menu { position: relative; }
  .views-menu-btn { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); background: none; border: none; cursor: pointer; }
  .views-menu-list { display: none; position: absolute; right: 0; top: 100%; margin-top: 6px; background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 12px 30px var(--shadow); min-width: 200px; z-index: 20; padding: 6px; }
  .views-menu-list.open { display: block; }
  .views-menu-list button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font-family: var(--font-body); font-size: 13px; padding: 7px 8px; border-radius: 5px; border: none; background: none; color: var(--ink); cursor: pointer; }
  .views-menu-list button:hover { background: var(--teal-soft); }
  .views-menu-list .del { color: var(--ink-faint); font-weight: 700; }
  .views-menu-list .del:hover { color: var(--rust); }
  .views-menu-list hr { border: none; border-top: 1px solid var(--rule); margin: 4px 0; }

  .ledger-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--body-copy); padding: 0 40px 10px; }
  .ledger-legend .item { display: flex; align-items: center; gap: 6px; }
  .ledger-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }

  .req-groups { padding: 0 40px 32px; display: flex; flex-direction: column; gap: 22px; }
  .req-group-head { display: flex; align-items: baseline; gap: 12px; padding: 6px 0 10px; border-bottom: 1.5px solid var(--ink); }
  .req-group-head .g-name { font-size: 17px; font-weight: 600; }
  .req-group-head .g-meta { font-size: 13px; }
  .req-group-head .g-hint { margin-left: auto; font-size: 13px; background: var(--ochre-soft); color: var(--ochre-text-1); border-radius: 5px; padding: 3px 9px; }
  .req-group-head .g-actions { margin-left: auto; display: flex; align-items: baseline; gap: 12px; }
  .req-group-head .g-actions .g-hint { margin-left: 0; }
  .g-link { font-family: var(--font-body); background: none; border: none; padding: 0; font-size: 13px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .g-link:hover { color: var(--ink); }
  .g-hint .g-link { color: var(--ochre-text-1); font-weight: 600; margin-left: 6px; }
  .req-group-head.no-customer { border-bottom: 1.5px dashed var(--rule-strong); }
  .req-note { font-size: 13px; color: var(--ink-faint); background: var(--paper-raised); border-top: 1px solid var(--rule); padding: 14px 40px; }
  .req-row { display: grid; grid-template-columns: 320px minmax(0,1fr) 120px; gap: 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .req-row:hover { background: var(--teal-soft); }
  .req-row .r-main .r-title { font-weight: 600; font-size: 15.5px; }
  .req-row .r-main .r-customers { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .req-row .r-main .r-customers.only { color: var(--ink-faint); }
  .req-row .r-list-cols { display: flex; gap: 28px; align-items: center; font-size: 13.5px; color: var(--ink-soft); }
  .req-row .r-list-cols .col-status { width: 110px; font-weight: 500; }
  .req-row .r-list-cols .col-urgency { width: 90px; }
  .req-row .r-list-cols .col-topic { width: 120px; }
  .req-row .r-ledger-bar { display: flex; height: 20px; gap: 2px; max-width: 320px; }
  .req-row .r-ledger-bar .seg { border-radius: 2px; }
  .req-row .r-due { font-size: 13px; text-align: right; font-weight: 500; color: var(--ink-soft); }
  .req-row .r-due.soon { color: var(--rust); }

  /* ---------------- Trends (3a) ---------------- */
  .trends-screen { padding: 24px 40px 40px; }
  .trends-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .trends-title { font-size: 26px; font-weight: 600; margin: 0; }
  .trends-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 28px; }
  .trends-col { display: flex; flex-direction: column; gap: 14px; }
  .trends-eyebrow-row { display: flex; align-items: baseline; gap: 10px; }
  .trends-footnote { font-size: 13px; color: var(--ink-faint); line-height: 1.5; }
  .pile-up-row { display: grid; grid-template-columns: 200px minmax(0,1fr) 28px; gap: 6px 14px; align-items: center; font-size: 14px; }
  .pile-up-row .name { font-weight: 500; }
  .pile-up-row .name .shipped-tag { font-size: 12px; color: var(--teal); font-weight: 600; margin-left: 6px; }
  .pile-up-row .bar { height: 12px; border-radius: 2px; }
  .pile-up-row .count { font-family: var(--font-mono); font-size: 12.5px; text-align: right; }
  .pile-up-callout { background: var(--rust-soft); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--rust-text); line-height: 1.5; }
  .side-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .side-list { display: flex; flex-direction: column; gap: 8px; }
  .side-list-head { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .side-list-row { display: flex; justify-content: space-between; font-size: 14px; padding: 7px 0; border-top: 1px solid var(--rule); cursor: pointer; }
  .side-list-row:last-of-type { border-bottom: 1px solid var(--rule); }
  .side-list-row .count { color: var(--ink-soft); }
  .side-list-row:hover { background: var(--teal-soft); }
  .side-list-caption { font-size: 12.5px; color: var(--ink-faint); }

  /* ---------------- Overlays / modals ---------------- */
  .overlay { position: fixed; inset: 0; background: rgba(20, 21, 16, 0.45); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .overlay.open { display: flex; }
  .modal { position: relative; background: var(--paper); border-radius: 10px; border: 1px solid var(--rule-strong); width: 100%; max-width: 560px; padding: 22px 24px 24px; box-shadow: 0 12px 40px var(--shadow); }
  .modal h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .modal .modal-sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type=text], .field textarea, .field select { width: 100%; font-family: var(--font-body); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink); }
  .field textarea { min-height: 60px; resize: vertical; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .close-x { position: absolute; top: 18px; right: 20px; background: none; border: none; font-size: 18px; color: var(--ink-faint); cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 9px; border-radius: 20px; border: 1px solid transparent; margin: 0 5px 5px 0; white-space: nowrap; }
  .chip.urgency-high { background: var(--rust-soft); color: var(--rust); }
  .chip.urgency-medium { background: var(--ochre-soft); color: var(--ochre); }
  .chip.urgency-low { background: var(--teal-soft); color: var(--teal); }
  .chip.segment { background: var(--rule); color: var(--ink-soft); }
  .chip.topic { background: transparent; color: var(--ink-soft); border-color: var(--rule-strong); }
  .chip.suggested { background: transparent; border: 1px dashed var(--rule-strong); color: var(--ink-faint); }
  .chip .accept, .chip .reject { cursor: pointer; font-weight: 700; padding: 0 2px; }
  .chip .accept:hover { color: var(--teal); }
  .chip .reject:hover { color: var(--rust); }
  .btn { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 5px; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .btn-danger:hover { color: var(--rust); border-color: var(--rust); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.new { background: var(--ink-faint); }
  .status-dot.planned { background: var(--ochre); }
  .status-dot.in-progress { background: var(--teal); }
  .status-dot.shipped { background: var(--ink); }
  .qlink { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
  .qlink:last-child { border-bottom: none; }
  .detail-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .detail-section h3 { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 0 0 8px; }

  /* ---------------- Request modal (3b), two-pane ---------------- */
  #detailOverlay .modal.req-modal { max-width: 1000px; padding: 0; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 30px 80px var(--shadow-modal); }
  .req-modal-panes { display: flex; flex: 1; min-height: 0; }
  .req-modal-left { flex: 1; padding: 32px 36px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; max-height: 640px; }
  .req-modal-left .rank-eyebrow { color: var(--teal); }
  .req-modal-left .req-title-input { font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; border: none; background: transparent; padding: 0; width: 100%; color: var(--ink); }
  .req-modal-left .req-desc-input { font-family: var(--font-body); font-size: 15px; color: var(--body-copy); border: none; background: transparent; padding: 0; width: 100%; resize: none; overflow: hidden; min-height: 24px; }
  .rank-why-row { display: flex; justify-content: space-between; align-items: baseline; }
  .rank-why-row .lbl { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .rank-why-row .adjust-link { font-size: 13px; color: var(--teal); font-weight: 600; background: none; border: none; cursor: pointer; padding: 0; }
  .score-bar { display: flex; height: 14px; gap: 2px; }
  .score-bar .seg { border-radius: 2px; }
  .score-parts-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; font-size: 13px; }
  .score-parts-grid .part-name { font-weight: 600; }
  .score-parts-grid .part-val { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .req-modal-left .section-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  /* Customer chip input + dropdown (4a/4b), shared by the new-request dialog and the request modal */
  .ci-field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 8px; background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: 8px; cursor: text; }
  .ci-field:focus-within { border-color: var(--ink); box-shadow: 0 0 0 0.5px var(--ink); }
  .ci-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 4px 6px 4px 10px; border-radius: 5px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink); }
  .ci-chip.is-new { border: 1px dashed var(--teal); }
  .ci-chip .ci-new { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--teal); }
  .ci-chip .ci-x { cursor: pointer; color: var(--ink-faint); font-size: 12px; padding: 0 3px; line-height: 1; }
  .ci-chip .ci-x:hover { color: var(--rust); }
  .ci-field input.ci-input[type=text] { flex: 1; width: auto; min-width: 120px; border: none; border-radius: 0; outline: none; background: transparent; font-family: var(--font-body); font-size: 14px; color: var(--ink); padding: 3px 2px; }
  #custModal .cm-help { font-size: 12.5px; color: var(--ink-faint); margin-top: 5px; }
  #custModal .cm-error { font-size: 13px; color: var(--rust); background: var(--rust-soft); border-radius: 6px; padding: 8px 10px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #custModal .cm-error button { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; background: none; border: 1px solid var(--rust); color: var(--rust); border-radius: 5px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
  #custModal .cm-section { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--ochre); margin: 18px 0 6px; }
  #custModal .cm-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 7px; margin-bottom: 6px; cursor: pointer; font-size: 14.5px; background: var(--paper-raised); }
  #custModal .cm-row.on { border-color: var(--teal); background: var(--teal-soft); }
  #custModal .cm-row input { margin: 0; accent-color: var(--teal); }
  #custModal .cm-row .cm-count { margin-left: auto; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  #custModal .cm-none { font-size: 13px; color: var(--ink-faint); margin-bottom: 6px; }
  #custModal .cm-search { margin-top: 8px; width: 100%; font-family: var(--font-body); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink); }
  #custModal .cm-results { margin-top: 6px; }
  #custModal .cm-result { padding: 8px 10px; border-radius: 6px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  #custModal .cm-result:hover { background: var(--paper-raised); }
  #custModal .cm-preview { margin-top: 16px; background: var(--teal-soft); border: 1px solid var(--teal-strip-border); color: var(--teal); border-radius: 7px; padding: 10px 12px; font-size: 13.5px; line-height: 1.5; }
  .cust-dropdown { position: fixed; z-index: 70; background: var(--paper-raised); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 12px 32px var(--shadow-modal); padding: 6px; overflow-y: auto; }
  .cust-dropdown .cd-label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; color: var(--ochre); padding: 6px 10px 4px; }
  .cust-dropdown .cd-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .cust-dropdown .cd-row .cd-count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .cust-dropdown .cd-row.hl { background: var(--teal-soft); }
  .cust-dropdown .cd-row.near.hl { background: var(--ochre-soft); }
  .cust-dropdown .cd-add { color: var(--body-copy); font-size: 14px; }
  .cust-dropdown .cd-divider { border-top: 1px solid var(--rule); margin: 4px 0; }
  .cust-dropdown .cd-key { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .cust-dropdown .cd-caption { font-size: 13px; color: var(--ink-faint); padding: 2px 10px 8px; }
  .linked-q-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 14px; }
  .linked-q-row .meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .show-more-link { padding: 9px 0; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--teal); font-weight: 600; cursor: pointer; background: none; border-left: none; border-right: none; border-bottom: none; text-align: left; }

  .req-modal-right { width: 300px; flex-shrink: 0; background: var(--paper-raised); border-left: 1px solid var(--rule); padding: 32px 24px; display: flex; flex-direction: column; gap: 4px; }
  .req-modal-right .close-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .prop-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--row-divider); position: relative; }
  .prop-row .p-label { font-size: 13px; color: var(--ink-soft); }
  .prop-row .p-value { font-size: 14px; font-weight: 500; }
  .prop-row .p-value.mono { font-family: var(--font-mono); }
  .prop-row select.prop-select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .req-modal-right .spacer { flex: 1; }
  .req-modal-right .ship-caption { font-size: 12.5px; color: var(--ink-faint); text-align: center; padding-top: 8px; line-height: 1.45; }
  .req-modal-footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 36px; border-top: 1px solid var(--rule); }
  .req-modal-footer .delete-link { font-size: 13.5px; color: var(--rust); background: none; border: none; cursor: pointer; padding: 0; }
  .add-new-inline { display: none; margin-top: 6px; }

  @media (max-width: 900px) {
    .now-screen { grid-template-columns: 1fr; }
    .now-left { border-right: none; border-bottom: 1px solid var(--rule); }
    .list-answer-grid { grid-template-columns: 1fr; }
    .req-modal-panes { flex-direction: column; }
    .req-modal-right { width: 100%; border-left: none; border-top: 1px solid var(--rule); }
  }
  @media (max-width: 640px) {
    header { padding: 14px; flex-wrap: wrap; }
    .ask-box { order: 3; max-width: none; width: 100%; }
    .field-row { flex-direction: column; }
    .req-row { grid-template-columns: 1fr; gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Question</div>
  <div class="ask-box" id="askBox">
    <span class="ask-dot"></span>
    <input type="text" id="askInput" placeholder="Ask what customers want, or what's worth doing…" autocomplete="off">
  </div>
  <div class="header-spacer"></div>
  <nav class="main-nav" id="mainNav"></nav>
  <select id="themeSelect" title="Theme">
    <option value="system">System theme</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
</header>

<main id="main"></main>

<div class="overlay" id="draftOverlay">
  <div class="modal">
    <button class="close-x" data-close="draftOverlay">&#10005;</button>
    <h2>New feature request</h2>
    <div class="modal-sub">Pulled from what you typed. Review the suggested tags before saving — urgency, tags and quarter can all still be changed later.</div>
    <div class="field"><label for="dTitle">Title</label><input type="text" id="dTitle" /></div>
    <div class="field"><label for="dDesc">Description</label><textarea id="dDesc"></textarea></div>
    <div class="field"><label>Customers</label><div id="dCustomers"></div></div>
    <div class="field"><label>Suggested tags</label><div id="dTags"></div></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="discardDraft">Discard</button>
      <button class="btn-primary" id="saveDraft">Save request</button>
    </div>
  </div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="modal">
    <button class="close-x" data-close="viewOverlay">&#10005;</button>
    <h2>Save this view</h2>
    <div class="modal-sub">Saves the current Group by / Layout / Shipped settings so you can come back to them.</div>
    <div class="field"><label for="vName">Name</label><input type="text" id="vName" placeholder="e.g. Enterprise asks" /></div>
    <div class="modal-actions">
      <button class="btn-secondary" data-close="viewOverlay">Cancel</button>
      <button class="btn-primary" id="saveView">Save view</button>
    </div>
  </div>
</div>

<div class="overlay" id="custOverlay"><div class="modal" id="custModal"></div></div>

<div class="overlay" id="detailOverlay"><div class="modal" id="detailModal"></div></div>

<script>
(async function(){
  "use strict";

  // Persistence goes through the real backend (markdown+frontmatter files
  // plus a disposable SQLite index — see src/backend.cjs), reached only via
  // the two calls preload.cjs exposes on window.questionAPI. The chat/answer
  // history (state.feed) stays in-memory only, same documented limitation
  // as before (resets on app restart) — everything else round-trips to disk.
  async function loadState(){
    const { requests, questions, settings, everSeeded } = await window.questionAPI.loadAll();
    if (requests.length === 0 && questions.length === 0 && !settings){
      return everSeeded ? blankState() : null;
    }
    return {
      requests, questions,
      views: (settings && settings.views) || defaultViews(),
      requestsControls: (settings && settings.requestsControls) || defaultRequestsControls(),
      scoreWeights: (settings && settings.scoreWeights) || defaultScoreWeights(),
      theme: (settings && settings.theme) || "system",
      customerAliases: (settings && settings.customerAliases) || {},
      activeScreen: "now",
      currentAnswer: null,
      feed: [],
    };
  }
  function saveState(){
    window.questionAPI.syncAll({
      requests: state.requests, questions: state.questions,
      settings: { views: state.views, requestsControls: state.requestsControls, scoreWeights: state.scoreWeights, theme: state.theme, customerAliases: state.customerAliases },
    }).catch(err => console.error("Failed to save:", err));
  }

  const URGENCY_RANK = { high: 3, medium: 2, low: 1 };
  const STATUS_ORDER = ["new", "planned", "in-progress", "shipped"];
  const STATUS_LABEL = { "new": "New", "planned": "Planned", "in-progress": "In progress", "shipped": "Shipped" };
  const STATUS_COLOR_VAR = { "new": "--ink-soft", "planned": "--ochre", "in-progress": "--teal", "shipped": "--ink-soft" };
  function statusColor(s){ return "var(" + (STATUS_COLOR_VAR[s] || "--ink-soft") + ")"; }
  function statusLabel(s){ return STATUS_LABEL[s] || (s ? s.charAt(0).toUpperCase()+s.slice(1) : s); }
  function isShipped(r){ return r.status === "shipped"; }
  function customStatuses(){
    const set = new Set();
    state.requests.forEach(r => { if (r.status && !STATUS_ORDER.includes(r.status)) set.add(r.status); });
    return Array.from(set).sort();
  }
  function customTopics(){
    const set = new Set();
    state.requests.forEach(r => { if (r.topic) set.add(r.topic); });
    return Array.from(set).sort();
  }

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
  function daysAgo(n){ return Date.now() - n*86400000; }

  // Requests-screen controls (Group by / Layout / Shipped filter) replace the
  // old tab strip of saved "views" — see docs handover README, "Requests
  // (2b)". state.views is kept around only as named presets of these three
  // controls (a small "Views ▾" menu), migrated from the old tab set below.
  // `filter` (optional) narrows the list to one customer, topic or quarter:
  // { type: "customer" | "topic" | "quarter", value }. It comes from "Save as view"
  // on a customer/topic/quarter answer, and is kept by saved views.
  function defaultRequestsControls(){ return { group: "quarter", layout: "list", shippedFilter: "hide", filter: null }; }
  function requestMatchesFilter(r, f){
    if (!f) return true;
    if (f.type === "customer") return requestsForCustomer(f.value).includes(r);
    if (f.type === "quarter") return (r.quarter || "Unscheduled") === f.value;
    return (r[f.type] || "").toLowerCase() === (f.value || "").toLowerCase();
  }
  function filterLabel(f){ return (f.type === "customer" ? "Customer" : f.type === "topic" ? "Topic" : "Quarter") + ": " + f.value; }
  function defaultViews(){
    // Migration table from the handover README: All requests -> None/List/all,
    // By urgency -> Urgency, Topic heat -> Topic, By quarter -> Quarter,
    // Shipped -> shipped only. "Today" is gone (it's the Now screen now).
    return [
      { id: uid("v"), name: "All requests", group: "none", layout: "list", shippedFilter: "all", builtin: true },
      { id: uid("v"), name: "By urgency", group: "urgency", layout: "list", shippedFilter: "hide", builtin: true },
      { id: uid("v"), name: "Topic heat", group: "topic", layout: "list", shippedFilter: "all", builtin: true },
      { id: uid("v"), name: "By quarter", group: "quarter", layout: "list", shippedFilter: "all", builtin: true },
      { id: uid("v"), name: "Shipped", group: "none", layout: "list", shippedFilter: "only", builtin: true },
    ];
  }
  function defaultScoreWeights(){ return { urgency: 3, customers: 2, questions: 1.5, age: 0.03, dueDate: 1 }; }

  function seed(){
    const requests = [
      { id: uid("req"), title: "Bulk export to CSV", description: "Export the full request list, not just the visible page.",
        customers: ["Acme", "Meridian Co", "Halden", "Brightline"],
        urgency: "high", topic: "export",
        status: "in-progress", quarter: "Q3 2026", dueDate: daysAgo(-3), createdAt: daysAgo(14), updatedAt: daysAgo(2), questionCount: 3, shippedAt: null },
      { id: uid("req"), title: "Role-based permissions", description: "Restrict who can edit vs. only view requests once the team grows.",
        customers: ["Otterly", "Halden"],
        urgency: "low", topic: "access",
        status: "new", quarter: "Q3 2026", dueDate: daysAgo(-2), createdAt: daysAgo(30), updatedAt: daysAgo(30), questionCount: 2, shippedAt: null },
      { id: uid("req"), title: "Currency conversion calculator", description: "Convert prices between currencies inline when viewing invoices.",
        customers: ["Acme", "Meridian Co", "Halden"],
        urgency: "medium", topic: "currency",
        status: "planned", quarter: "Q4 2026", dueDate: daysAgo(-10), createdAt: daysAgo(58), updatedAt: daysAgo(58), questionCount: 2, shippedAt: null },
      { id: uid("req"), title: "Weighted priority score", description: "A single combined score view blending urgency, customer count and age.",
        customers: ["Acme"],
        urgency: "low", topic: "prioritisation",
        status: "planned", quarter: "Q4 2026", dueDate: daysAgo(-25), createdAt: daysAgo(20), updatedAt: daysAgo(20), questionCount: 1, shippedAt: null },
      { id: uid("req"), title: "Slack notifications for new questions", description: "Ping a Slack channel whenever a customer question comes in unanswered.",
        customers: ["Brightline"],
        urgency: "medium", topic: "notifications",
        status: "new", quarter: "Unscheduled", dueDate: null, createdAt: daysAgo(12), updatedAt: daysAgo(12), questionCount: 1, shippedAt: null },
      { id: uid("req"), title: "Dark theme", description: "Full dark theme across the app, not just the editor.",
        customers: ["Halden"],
        urgency: "low", topic: "appearance",
        status: "shipped", quarter: "Q2 2026", dueDate: null, createdAt: daysAgo(140), updatedAt: daysAgo(100), questionCount: 1, shippedAt: daysAgo(100) },
    ];
    const questions = [
      { id: uid("q"), text: "Can I export everything, not just the page I'm on?", matchedRequestId: requests[0].id, answer: null, createdAt: daysAgo(2) },
      { id: uid("q"), text: "Does the export support scheduling?", matchedRequestId: requests[0].id, answer: null, createdAt: daysAgo(5) },
      { id: uid("q"), text: "Is there a CSV download?", matchedRequestId: requests[0].id, answer: null, createdAt: daysAgo(9) },
      { id: uid("q"), text: "Can we show prices in EUR as well as USD?", matchedRequestId: requests[2].id, answer: null, createdAt: daysAgo(50) },
      { id: uid("q"), text: "Does the currency calculator support GBP?", matchedRequestId: requests[2].id, answer: null, createdAt: daysAgo(20) },
      { id: uid("q"), text: "Is there a dark theme yet?", matchedRequestId: requests[5].id, answer: "Shipped in Q2 2026 — toggle it in settings.", createdAt: daysAgo(90) },
      { id: uid("q"), text: "Can we restrict who's allowed to edit requests?", matchedRequestId: requests[1].id, answer: null, createdAt: daysAgo(20) },
      { id: uid("q"), text: "Is there a view-only role for requests?", matchedRequestId: requests[1].id, answer: null, createdAt: daysAgo(6) },
      { id: uid("q"), text: "Can this ping a Slack channel when a question comes in?", matchedRequestId: requests[4].id, answer: null, createdAt: daysAgo(10) },
      // These three, and the two below, are worded to deliberately share 2+
      // stemmed words with each other (see clusterUnmatchedQuestions() /
      // stem() further down) so the seed data actually demonstrates a
      // "recurring theme" on first launch, instead of relying on wording
      // that merely *looks* similar to a person but doesn't overlap under
      // the app's real (literal, non-semantic) matching.
      { id: uid("q"), text: "Does it work without internet access?", matchedRequestId: null, answer: null, createdAt: daysAgo(12) },
      { id: uid("q"), text: "Can I use it with no internet access?", matchedRequestId: null, answer: null, createdAt: daysAgo(4) },
      { id: uid("q"), text: "Does it need internet access to run?", matchedRequestId: null, answer: null, createdAt: daysAgo(1) },
      { id: uid("q"), text: "Can I see the change history for a request?", matchedRequestId: null, answer: null, createdAt: daysAgo(18) },
      { id: uid("q"), text: "Is there a change history log per request?", matchedRequestId: null, answer: null, createdAt: daysAgo(6) },
    ];
    return {
      requests, questions,
      views: defaultViews(),
      requestsControls: defaultRequestsControls(),
      scoreWeights: defaultScoreWeights(),
      customerAliases: {},
      activeScreen: "now", currentAnswer: null, feed: []
    };
  }

  function blankState(){
    return {
      requests: [], questions: [],
      views: defaultViews(),
      requestsControls: defaultRequestsControls(),
      scoreWeights: defaultScoreWeights(),
      customerAliases: {},
      activeScreen: "now", currentAnswer: null, feed: []
    };
  }

  function migrateState(s){
    s.requests.forEach(r => {
      if (r.urgency === undefined){
        const utag = (r.tags || []).find(t => t.type === "urgency");
        r.urgency = utag ? utag.value : "medium";
      }
      if (!["high","medium","low"].includes(r.urgency)) r.urgency = "medium";
      if (r.topic === undefined){
        const ttag = (r.tags || []).find(t => t.type === "topic" && t.state === "accepted") || (r.tags || []).find(t => t.type === "topic");
        r.topic = ttag ? ttag.value : null;
      }
      delete r.tags;
      delete r.segment;
      delete r.shipped;
      if (r.updatedAt === undefined) r.updatedAt = r.createdAt;
      if (r.dueDate === undefined) r.dueDate = null;
      // shippedAt is derived/recorded alongside status==="shipped" (not a
      // second source of truth for *whether* it's shipped — see
      // docs/DESIGN.md — just *when*, for the Trends "shipped but still
      // asked" callout). Backfill it for anything already shipped from a
      // save that predates this field, using updatedAt as the best guess.
      if (r.shippedAt === undefined) r.shippedAt = isShipped(r) ? (r.updatedAt || r.createdAt) : null;
    });
    if (!s.scoreWeights) s.scoreWeights = defaultScoreWeights();
    if (!s.views || !s.views.length) s.views = defaultViews();
    // Old tab-based views (layout: table/board/gallery, sort/dir) migrate into
    // the new group/layout/shippedFilter shape used by the Requests screen.
    // "Today" (sort==="score") is gone — it's the Now screen now.
    s.views = s.views.filter(v => v.sort !== "score").map(v => ({
      id: v.id, name: v.name,
      group: v.group === "status" ? "none" : (v.group || "none"),
      layout: "list",
      shippedFilter: v.shippedFilter || "all",
      filter: v.filter || null,
      builtin: !!v.builtin,
    }));
    if (!s.requestsControls) s.requestsControls = defaultRequestsControls();
    if (s.requestsControls.filter === undefined) s.requestsControls.filter = null;
    if (!s.activeScreen) s.activeScreen = "now";
    if (s.currentAnswer === undefined) s.currentAnswer = null;
    if (!s.feed) s.feed = [];
    if (!s.theme) s.theme = "system";
    if (!s.customerAliases || typeof s.customerAliases !== "object") s.customerAliases = {};
    return s;
  }

  function applyTheme(){
    if (state.theme === "light" || state.theme === "dark") document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
  }

  let state = migrateState((await loadState()) || seed());

  // ---------------- Topic / tag suggestion (unchanged logic) ----------------
  function suggestTopic(text){
    const words = new Set(stem(text));
    if (words.size === 0) return null;
    let best = null, bestScore = 0;
    customTopics().forEach(topic => {
      const reqs = state.requests.filter(r => r.topic === topic);
      if (!reqs.length) return;
      const hay = stem(reqs.map(r => r.title + " " + r.description).join(" "));
      const score = overlap(words, hay);
      if (score > bestScore){ bestScore = score; best = topic; }
    });
    if (!best) return null;
    const n = state.requests.filter(r => r.topic === best).length;
    return { type:"topic", value:best, state:"suggested", reason:`similar wording to ${n} existing "${best}" request${n===1?"":"s"}` };
  }
  function suggestTags(text){
    const t = text.toLowerCase(); const tags = [];
    if (/urgent|asap|blocking|critical|breaking/.test(t)) tags.push({ type:"urgency", value:"high", state:"suggested", reason:"urgent language" });
    else if (/nice to have|whenever|no rush/.test(t)) tags.push({ type:"urgency", value:"low", state:"suggested", reason:"low-urgency language" });
    else tags.push({ type:"urgency", value:"medium", state:"suggested", reason:"default — no strong signal" });
    const topicTag = suggestTopic(text);
    if (topicTag) tags.push(topicTag);
    return tags;
  }
  function extractCustomers(text){
    const m = text.match(/(?:from|by|for)\s+([A-Z][A-Za-z&.]+(?:\s[A-Z][A-Za-z&.]+)*(?:,\s*[A-Z][A-Za-z&.]+(?:\s[A-Z][A-Za-z&.]+)*)*)/);
    if (!m) return [];
    return m[1].split(/,| and /).map(s=>s.trim()).filter(Boolean);
  }
  // Parses/picks the customer chip shown next to the echoed question on the
  // Answer screen: an explicit "requested by/for/from X" phrase first (same
  // pattern used for feature-request drafts), otherwise a known customer name
  // mentioned anywhere in the text (whole-word match against the curated
  // customer vocabulary — never free-text — same spirit as matchEntities()).
  function parseCustomerFromText(text){
    const explicit = extractCustomers(text);
    if (explicit.length) return resolveCustomer(explicit[0]);
    // Longest name first, so "Acme Financial" wins over "Acme" when both are in the text.
    const names = knownCustomers().map(c => ({ name: c, canon: c }))
      .concat(Object.keys(state.customerAliases).map(k => ({ name: k, canon: resolveCustomer(k) })))
      .sort((a, b) => b.name.length - a.name.length);
    for (const { name, canon } of names){
      const re = new RegExp("\\b" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
      if (re.test(text)) return canon;
    }
    return null;
  }
  const STOPWORDS = new Set(["the","a","an","is","are","was","were","be","been","being","to","of","in","on","at","by",
    "for","with","and","or","but","not","no","do","does","did","it","its","this","that","these","those","i","you",
    "he","she","we","they","his","her","our","your","their","as","if","so","up","out","can","will","would","should",
    "could","may","might","must","than","then","when","what","who","whom","which","how","why","where","there","here",
    "about","into","from","over","under","again","just","also","any","all","some","such","only","own","same","too"]);
  function stem(text){ return text.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w => w.length > 0 && !STOPWORDS.has(w)); }
  function overlap(wordSet, arr){ let c = 0; for (const w of arr) if (wordSet.has(w)) c++; return c; }
  function findAnswer(text){
    const words = new Set(stem(text)); let best = null, bestScore = 0;
    for (const q of state.questions){
      if (!q.answer) continue;
      const score = overlap(words, stem(q.text));
      if (score > bestScore){ bestScore = score; best = { type:"question", item:q, score }; }
    }
    for (const r of state.requests){
      const hay = stem(r.title + " " + r.description);
      const score = overlap(words, hay);
      if (score > bestScore){ bestScore = score; best = { type:"request", item:r, score }; }
    }
    return (best && bestScore >= 1) ? best : null;
  }
  function isRequestIntent(text){ return /^raise (a )?(new )?feature request|^new feature request|^feature request[:]/i.test(text.trim()); }

  // ---------------- Entity lookup (customer / topic / quarter) ----------------
  // Distinct customers, one spelling each (names that differ only in case or
  // spacing are one customer; the most-used spelling is shown).
  function knownCustomers(){
    const best = new Map();
    customerCounts().forEach((count, name) => {
      const k = normCustomer(name), cur = best.get(k);
      if (!cur || count > cur.count || (count === cur.count && name.localeCompare(cur.name) < 0)) best.set(k, { name, count });
    });
    return Array.from(best.values()).map(x => x.name);
  }
  // The one spelling to use for a customer name typed or found anywhere:
  // 1. a name already on some request (ignoring case), else
  // 2. the name it was merged/renamed into (customerAliases), else
  // 3. the name as given. Deliberately adding "Acme Ltd" as its own customer
  //    (the dropdown's "Add as new" row) still works: once it's on a request,
  //    rule 1 keeps it separate.
  function resolveCustomer(name){
    const n = (name || "").replace(/\s+/g, " ").trim();
    if (!n) return n;
    const k = normCustomer(n);
    const hit = knownCustomers().find(c => normCustomer(c) === k);
    if (hit) return hit;
    const target = state.customerAliases[k];
    if (target){
      const t = knownCustomers().find(c => normCustomer(c) === normCustomer(target));
      return t || target;
    }
    return n;
  }
  function knownTags(){
    const map = new Map();
    state.requests.forEach(r => {
      if (!r.topic) return;
      const key = "topic|" + r.topic.toLowerCase();
      if (!map.has(key)) map.set(key, { type: "topic", value: r.topic });
    });
    return Array.from(map.values());
  }
  function matchEntities(text){
    const q = text.trim().toLowerCase();
    if (q.length < 2) return { customers: [], tags: [] };
    const customers = knownCustomers();
    const tags = knownTags();
    let cMatches = customers.filter(c => c.toLowerCase() === q);
    // A name that was merged away ("Acme Ltd" -> "Acme") finds the customer it became.
    if (cMatches.length === 0 && state.customerAliases[normCustomer(q)]){
      const canon = resolveCustomer(q);
      cMatches = customers.filter(c => normCustomer(c) === normCustomer(canon));
    }
    let tMatches = tags.filter(t => t.value.toLowerCase() === q);
    if (cMatches.length === 0 && tMatches.length === 0 && q.length >= 3){
      cMatches = customers.filter(c => c.toLowerCase().includes(q));
      tMatches = tags.filter(t => t.value.toLowerCase().includes(q));
    }
    return { customers: cMatches, tags: tMatches };
  }

  // ---------------- Customer chip input (shared) ----------------
  // One input used everywhere a customer is entered (the new-request dialog
  // and the request modal), so you can see whether a name already exists
  // while typing. See docs/DESIGN.md, "Customers".
  const CUSTOMER_SUFFIXES = new Set(["ltd","limited","inc","incorporated","co","corp","corporation","llc","plc","gmbh","pty"]);
  function normCustomer(s){ return (s||"").toLowerCase().replace(/\s+/g, " ").trim(); }
  // Lowercased, punctuation removed, trailing company suffixes (Ltd, Inc, Co…) dropped.
  function stripCustomerSuffix(s){
    const words = normCustomer(s).replace(/[.,;:'"()&!]/g, " ").split(/\s+/).filter(Boolean);
    while (words.length > 1 && CUSTOMER_SUFFIXES.has(words[words.length-1])) words.pop();
    return words.join(" ");
  }
  function editDistance(a, b){
    const prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++){
      let diag = prev[0]; prev[0] = i;
      for (let j = 1; j <= b.length; j++){
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j-1] + 1, diag + (a[i-1] === b[j-1] ? 0 : 1));
        diag = tmp;
      }
    }
    return prev[b.length];
  }
  // How alike two customer names are: 0 when they're the same once punctuation
  // and a trailing suffix (Ltd, Inc, Co…) are ignored, a small number for a
  // likely typo, null when they should be treated as different customers. Only
  // names of 5+ letters can be typos of each other (1 letter apart up to 7
  // letters, 2 apart from 8), so short names don't false-match ("Acme"/"Acne").
  function customerSimilarity(a, b){
    const as = stripCustomerSuffix(a), bs = stripCustomerSuffix(b);
    if (as === bs) return 0;
    const shortest = Math.min(as.length, bs.length);
    if (shortest < 5) return null;
    const dist = editDistance(as, bs);
    return dist <= (shortest >= 8 ? 2 : 1) ? dist : null;
  }
  // Every distinct customer spelling in use, with how many requests carry it.
  function customerCounts(){
    const m = new Map();
    state.requests.forEach(r => r.customers.forEach(c => m.set(c, (m.get(c) || 0) + 1)));
    return m;
  }
  // What the dropdown shows for the text typed so far. `chosen` are the names
  // already on this request (left out of the suggestions).
  // kind: "exact" | "partial" | "near" | "new" | "already" | "none"
  function customerSuggestions(typed, counts, chosen, aliases){
    const t = normCustomer(typed);
    if (!t) return { kind: "none", rows: [], canAdd: false };
    const taken = new Set(chosen.map(normCustomer));
    const all = Array.from(counts.entries()).map(([name, count]) => ({ name, count }))
      .filter(c => !taken.has(normCustomer(c.name)))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    const partial = all.filter(c => normCustomer(c.name).includes(t));
    if (taken.has(t)) return { kind: "already", rows: partial, canAdd: false };
    // 1. Same name ignoring case/spacing: no "add" row, Enter uses the existing spelling.
    const exact = all.filter(c => normCustomer(c.name) === t);
    if (exact.length) return { kind: "exact", rows: exact.concat(partial.filter(c => !exact.includes(c))), canAdd: false };
    // 1b. A name that was merged/renamed away ("Acme Ltd" -> "Acme") offers the customer it became.
    const target = aliases && aliases[t] ? normCustomer(aliases[t]) : null;
    const viaAlias = target ? all.filter(c => normCustomer(c.name) === target) : [];
    if (viaAlias.length) return { kind: "exact", rows: viaAlias, canAdd: true };
    // 2. Part of an existing name.
    if (partial.length) return { kind: "partial", rows: partial, canAdd: true };
    // 3. Likely typo or variant: same once suffix/punctuation is stripped, or a
    //    letter or two apart. Only for names of 5+ letters (1 apart up to 7
    //    letters, 2 apart from 8) so short names don't false-match.
    const near = [];
    all.forEach(c => {
      const d = customerSimilarity(typed, c.name);
      if (d !== null) near.push({ name: c.name, count: c.count, d });
    });
    near.sort((a, b) => a.d - b.d || b.count - a.count || a.name.localeCompare(b.name));
    if (near.length) return { kind: "near", rows: near, canAdd: true };
    // 4. Genuinely new.
    return { kind: "new", rows: [], canAdd: true };
  }

  // For the Requests screen's Group by Customer: which customers may be the same
  // as another one. Maps a customer to the similar names that have fewer
  // requests (ties go to the alphabetically first name), so the hint shows on
  // the bigger customer only.
  function customerDuplicateHints(){
    const counts = customerCounts();
    const names = Array.from(counts.keys());
    const hints = new Map();
    names.forEach(a => {
      const smaller = [];
      names.forEach(b => {
        if (a === b || customerSimilarity(a, b) === null) return;
        const ca = counts.get(a), cb = counts.get(b);
        if (ca > cb || (ca === cb && a.localeCompare(b) < 0)) smaller.push({ name: b, count: cb });
      });
      if (smaller.length) hints.set(a, smaller.sort((x, y) => y.count - x.count || x.name.localeCompare(y.name)).map(x => x.name));
    });
    return hints;
  }

  let custDropdownEl = null;
  function custDropdown(){
    if (!custDropdownEl){
      custDropdownEl = document.createElement("div");
      custDropdownEl.className = "cust-dropdown";
      custDropdownEl.style.display = "none";
      custDropdownEl.addEventListener("mousedown", e => e.preventDefault()); // keep focus in the input
      document.body.appendChild(custDropdownEl);
    }
    return custDropdownEl;
  }
  function hideCustDropdown(){ if (custDropdownEl) custDropdownEl.style.display = "none"; }

  // opts: { values, placeholder, commitOnBlur, onChange(values, { viaBlur }) }
  function createCustomerInput(mount, opts){
    opts = opts || {};
    let chips = (opts.values || []).map(name => ({ name, isNew: false }));
    let sugg = { kind: "none", rows: [], canAdd: false };
    let items = [];
    let hl = -1;
    mount.innerHTML = "";
    const field = document.createElement("div");
    field.className = "ci-field";
    const input = document.createElement("input");
    input.type = "text"; input.className = "ci-input"; input.autocomplete = "off"; input.spellcheck = false;
    input.placeholder = opts.placeholder || "Add a customer…";
    field.appendChild(input);
    mount.appendChild(field);

    const values = () => chips.map(c => c.name);
    const knownLower = () => new Set(Array.from(customerCounts().keys()).map(normCustomer));
    function notify(viaBlur){ if (opts.onChange) opts.onChange(values(), { viaBlur: !!viaBlur }); }

    function paintChips(){
      field.querySelectorAll(".ci-chip").forEach(el => el.remove());
      chips.forEach((c, i) => {
        const el = document.createElement("span");
        el.className = "ci-chip" + (c.isNew ? " is-new" : "");
        el.innerHTML = `${escapeHtml(c.name)}${c.isNew ? ` <span class="ci-new">NEW</span>` : ""}<span class="ci-x" title="Remove">&#10005;</span>`;
        el.querySelector(".ci-x").onclick = ev => { ev.stopPropagation(); chips.splice(i, 1); paintChips(); hideCustDropdown(); notify(); input.focus(); };
        field.insertBefore(el, input);
      });
    }
    // Add several names at once (one notify, so autosave re-renders once).
    function addNames(list, viaBlur){
      const known = knownLower();
      let changed = false;
      list.forEach(({ name, isNew }) => {
        const n = (name || "").replace(/\s+/g, " ").trim();
        if (!n || chips.some(c => normCustomer(c.name) === normCustomer(n))) return;
        chips.push({ name: n, isNew: isNew === undefined ? !known.has(normCustomer(n)) : isNew });
        changed = true;
      });
      input.value = "";
      paintChips();
      hideCustDropdown();
      if (changed) notify(viaBlur);
    }
    // Typed text taken literally (comma / blur / save): the existing spelling if
    // the name matches one ignoring case, or the name it was merged into,
    // otherwise a new customer.
    function literalName(text){
      const name = resolveCustomer(text);
      return { name, isNew: !knownLower().has(normCustomer(name)) };
    }

    function refresh(){
      if (!mount.isConnected){ hideCustDropdown(); return; }
      const typed = input.value.trim();
      sugg = customerSuggestions(typed, customerCounts(), values(), state.customerAliases);
      items = sugg.rows.map(r => ({ type: "existing", name: r.name }));
      if (sugg.canAdd) items.push({ type: "add", name: typed });
      hl = sugg.kind === "already" ? -1 : (items.length ? 0 : -1);
      paint();
    }
    function paint(){
      const dd = custDropdown();
      if (!mount.isConnected || sugg.kind === "none"){ hideCustDropdown(); return; }
      const typed = input.value.trim();
      const tl = typed.toLowerCase();
      const rowHtml = (r, i) => {
        let nameHtml = escapeHtml(r.name);
        if (sugg.kind === "partial" || sugg.kind === "exact"){
          const at = r.name.toLowerCase().indexOf(tl);
          if (at >= 0) nameHtml = escapeHtml(r.name.slice(0, at)) + "<b>" + escapeHtml(r.name.slice(at, at + typed.length)) + "</b>" + escapeHtml(r.name.slice(at + typed.length));
        } else if (sugg.kind === "near" && i === 0) nameHtml = "<b>" + nameHtml + "</b>";
        return `<div class="cd-row ${sugg.kind === "near" ? "near " : ""}${i === hl ? "hl" : ""}" data-i="${i}"><span>${nameHtml}</span><span class="cd-count">${r.count} request${r.count === 1 ? "" : "s"}</span></div>`;
      };
      let html = "";
      if (sugg.kind === "near") html += `<div class="cd-label">DID YOU MEAN</div>`;
      html += sugg.rows.map(rowHtml).join("");
      if (sugg.kind === "already") html += `<div class="cd-caption">“${escapeHtml(typed)}” is already on this request.</div>`;
      if (sugg.canAdd){
        const ai = items.length - 1;
        if (sugg.rows.length) html += `<div class="cd-divider"></div>`;
        const key = sugg.kind === "near" ? "⇧ Enter" : sugg.kind === "new" ? "Enter" : "";
        html += `<div class="cd-row cd-add ${ai === hl ? "hl" : ""}" data-i="${ai}"><span>Add <b>“${escapeHtml(typed)}”</b> as a new customer</span>${key ? `<span class="cd-key">${key}</span>` : ""}</div>`;
        if (sugg.kind === "new") html += `<div class="cd-caption">No existing customer is similar.</div>`;
      }
      dd.innerHTML = html;
      dd.onclick = e => { const row = e.target.closest("[data-i]"); if (row) pick(+row.getAttribute("data-i")); };
      dd.style.display = "block";
      place(dd);
    }
    function place(dd){
      const rect = field.getBoundingClientRect();
      dd.style.left = rect.left + "px"; dd.style.width = rect.width + "px";
      const below = window.innerHeight - rect.bottom - 12, above = rect.top - 12;
      if (below < 240 && above > below){ dd.style.top = ""; dd.style.bottom = (window.innerHeight - rect.top + 6) + "px"; dd.style.maxHeight = Math.max(160, above) + "px"; }
      else { dd.style.bottom = ""; dd.style.top = (rect.bottom + 6) + "px"; dd.style.maxHeight = Math.max(160, below) + "px"; }
    }
    function pick(i){
      const it = items[i];
      if (!it) return;
      addNames([it.type === "add" ? { name: it.name, isNew: true } : { name: it.name, isNew: false }]);
      input.focus();
    }

    input.addEventListener("input", () => {
      if (input.value.includes(",")){
        const parts = input.value.split(",");
        const rest = parts.pop();
        addNames(parts.filter(p => p.trim()).map(literalName));
        input.value = rest;
      }
      refresh();
    });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        if (!items.length) return;
        e.preventDefault();
        hl = e.key === "ArrowDown" ? (hl + 1) % items.length : (hl <= 0 ? items.length - 1 : hl - 1);
        paint();
      } else if (e.key === "Enter"){
        e.preventDefault();
        if (!input.value.trim()) return;
        if (e.shiftKey && sugg.canAdd){ pick(items.length - 1); return; }
        if (hl >= 0) pick(hl); else input.value = "", refresh();
      } else if (e.key === "Backspace" && input.value === "" && chips.length){
        chips.pop(); paintChips(); hideCustDropdown(); notify();
      } else if (e.key === "Escape"){
        hideCustDropdown();
      }
    });
    input.addEventListener("blur", () => {
      hideCustDropdown();
      if (opts.commitOnBlur && input.value.trim()) addNames([literalName(input.value)], true);
    });
    field.addEventListener("click", e => { if (e.target === field) input.focus(); });
    window.addEventListener("resize", () => { if (mount.isConnected && custDropdownEl && custDropdownEl.style.display !== "none") place(custDropdownEl); });

    paintChips();
    return {
      getValues: values,
      focus: () => input.focus(),
      // Text typed but not yet committed (e.g. the person clicks Save) is kept, not lost.
      commitPending: () => { if (input.value.trim()) addNames([literalName(input.value)]); },
      // Prefill (e.g. names found in a typed question): existing spelling if known, else marked new.
      setValues: list => { chips = []; input.value = ""; addNames((list || []).map(literalName)); if (!list || !list.length) paintChips(); },
    };
  }

  // ---------------- Edit / merge customer ----------------
  // Renames a customer on every request that has it and can fold other
  // customers into it in the same step. Question text is never edited: each
  // old spelling is recorded in state.customerAliases so a question that says
  // "Acme Ltd" still resolves to "Acme". See docs/DESIGN.md, "Customers".
  function applyCustomerEdit(editing, newName, mergeNames){
    const olds = [editing].concat(mergeNames || []);
    const oldKeys = new Set(olds.map(normCustomer));
    const nk = normCustomer(newName);
    state.requests.forEach(r => {
      if (!r.customers.some(c => oldKeys.has(normCustomer(c)))) return;
      const out = []; let placed = false;
      r.customers.forEach(c => {
        if (!oldKeys.has(normCustomer(c))) out.push(c);
        else if (!placed){ out.push(newName); placed = true; } // a request that had both counts once
      });
      r.customers = out;
    });
    const al = state.customerAliases;
    Object.keys(al).forEach(k => { if (oldKeys.has(normCustomer(al[k]))) al[k] = newName; }); // no chains
    olds.forEach(o => { if (normCustomer(o) !== nk) al[normCustomer(o)] = newName; });
    delete al[nk];
    Object.keys(al).forEach(k => { if (k === normCustomer(al[k])) delete al[k]; });
  }
  // Customers that look like `name` (same name bar suffix/punctuation, or a typo).
  function similarCustomers(name){
    const counts = customerCounts();
    return Array.from(counts.keys()).filter(c => c !== name && customerSimilarity(name, c) !== null)
      .sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
  }
  function openCustomerDialog(name, preTick){
    const modal = document.getElementById("custModal");
    const counts = customerCounts();
    const total = counts.get(name) || 0;
    const similar = similarCustomers(name);
    const extras = [];                                   // other customers added via search
    const ticked = new Set((preTick || []).filter(n => counts.has(n) && n !== name));
    (preTick || []).forEach(n => { if (ticked.has(n) && !similar.includes(n)) extras.push(n); });
    modal.innerHTML = `
      <button class="close-x" data-close="custOverlay">&#10005;</button>
      <h2>Edit customer</h2>
      <div class="modal-sub">Rename it, or fold customers that are really the same one into it.</div>
      <div class="field" style="margin-bottom:0;"><label for="cmName">Name</label><input type="text" id="cmName" value="${escapeHtml(name)}" autocomplete="off" spellcheck="false" />
        <div class="cm-help">Renaming updates all ${total} request${total===1?"":"s"} and their linked questions.</div>
        <div id="cmError"></div></div>
      <div id="cmMerge"></div>
      <div id="cmPreview"></div>
      <div class="modal-actions"><button class="btn-secondary" id="cmCancel">Cancel</button><button class="btn-primary" id="cmSave">Save</button></div>`;
    const nameEl = modal.querySelector("#cmName");
    const key = s => normCustomer(s);

    function rowsHtml(list, note){
      return list.map(c => `<label class="cm-row ${ticked.has(c)?"on":""}"><input type="checkbox" data-cm="${escapeHtml(c)}" ${ticked.has(c)?"checked":""} /><span>${escapeHtml(c)}</span><span class="cm-count">${counts.get(c)} request${counts.get(c)===1?"":"s"}${note?" · "+note:""}</span></label>`).join("");
    }
    function paintMerge(){
      const box = modal.querySelector("#cmMerge");
      box.innerHTML = `<div class="cm-section">${similar.length || extras.length ? "MERGE OTHER CUSTOMERS INTO THIS ONE" : "MERGE"}</div>
        ${similar.length ? rowsHtml(similar, "similar") : `<div class="cm-none">No similar customers found.</div>`}
        ${extras.length ? rowsHtml(extras, "") : ""}
        <input type="text" class="cm-search" id="cmSearch" placeholder="Search other customers…" autocomplete="off" />
        <div class="cm-results" id="cmResults"></div>`;
      box.querySelectorAll("[data-cm]").forEach(cb => cb.onchange = () => {
        const n = cb.getAttribute("data-cm");
        if (cb.checked) ticked.add(n); else ticked.delete(n);
        paintMerge(); update();
      });
      const search = box.querySelector("#cmSearch"), results = box.querySelector("#cmResults");
      search.oninput = () => {
        const t = key(search.value);
        const pool = Array.from(counts.keys()).filter(c => c !== name && !similar.includes(c) && !extras.includes(c) && t && key(c).includes(t))
          .sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b)).slice(0, 6);
        results.innerHTML = pool.length ? pool.map(c => `<div class="cm-result" data-add="${escapeHtml(c)}"><span>${escapeHtml(c)}</span><span class="mono-meta">${counts.get(c)} request${counts.get(c)===1?"":"s"}</span></div>`).join("")
          : (t ? `<div class="cm-none">No other customer matches “${escapeHtml(search.value.trim())}”.</div>` : "");
        results.querySelectorAll("[data-add]").forEach(el => el.onclick = () => {
          const n = el.getAttribute("data-add"); extras.push(n); ticked.add(n); paintMerge(); update();
        });
      };
    }
    function update(){
      const newName = nameEl.value.replace(/\s+/g, " ").trim();
      const merged = Array.from(ticked);
      const set = new Set([name].concat(merged).map(key));
      // Renaming onto a customer that already exists (and isn't being merged) is blocked.
      const clash = newName ? Array.from(counts.keys()).find(c => c !== name && key(c) === key(newName) && !ticked.has(c)) : null;
      const err = modal.querySelector("#cmError");
      err.innerHTML = clash ? `<div class="cm-error"><span>“${escapeHtml(clash)}” already exists (${counts.get(clash)} request${counts.get(clash)===1?"":"s"}). Merge it into this customer instead?</span><button type="button" data-cm-merge="${escapeHtml(clash)}">Merge</button></div>` : "";
      const mb = err.querySelector("[data-cm-merge]");
      if (mb) mb.onclick = () => { const n = mb.getAttribute("data-cm-merge"); nameEl.value = n; if (!similar.includes(n) && !extras.includes(n)) extras.push(n); ticked.add(n); paintMerge(); update(); };
      const union = state.requests.filter(r => r.customers.some(c => set.has(key(c)))).length;
      const sum = [name].concat(merged).reduce((n, c) => n + (counts.get(c) || 0), 0);
      const both = sum - union;
      const preview = modal.querySelector("#cmPreview");
      const renamed = newName && newName !== name;
      if (!newName || clash || (!renamed && !merged.length)) preview.innerHTML = "";
      else preview.innerHTML = `<div class="cm-preview">${renamed ? `<b>${escapeHtml(name)}</b> → <b>${escapeHtml(newName)}</b>. ` : ""}${merged.length ? `<b>${escapeHtml(newName)}</b> will have <b>${union}</b> request${union===1?"":"s"}` + ` (${merged.map(escapeHtml).join(", ")} folded in${both > 0 ? `; ${both} request${both===1?" that had":"s that had"} both count${both===1?"s":""} once` : ""}).` : `${union} request${union===1?"":"s"} updated.`} Questions keep their wording.</div>`;
      const save = modal.querySelector("#cmSave");
      save.textContent = merged.length ? `Save and merge ${merged.length}` : "Save";
      save.disabled = !newName || !!clash;
      save.style.opacity = save.disabled ? "0.5" : "";
    }
    function doSave(){
      const newName = nameEl.value.replace(/\s+/g, " ").trim();
      const merged = Array.from(ticked);
      if (!newName) return;
      const clash = Array.from(counts.keys()).find(c => c !== name && key(c) === key(newName) && !ticked.has(c));
      if (clash) return;
      if (newName !== name || merged.length){ applyCustomerEdit(name, newName, merged); saveState(); }
      closeOverlay("custOverlay");
      render();
    }
    const close = () => { closeOverlay("custOverlay"); };
    modal.querySelector("[data-close]").onclick = close;
    modal.querySelector("#cmCancel").onclick = close;
    modal.querySelector("#cmSave").onclick = doSave;
    nameEl.addEventListener("input", update);
    modal.onkeydown = e => {
      if (e.key === "Escape"){ e.preventDefault(); close(); }
      else if (e.key === "Enter" && e.target === nameEl){ e.preventDefault(); doSave(); }
    };
    paintMerge(); update();
    openOverlay("custOverlay");
    nameEl.focus(); nameEl.select();
  }
  function parseQuarterSort(q){
    const m = /^Q([1-4])\s+(\d{4})$/.exec(q || "");
    return m ? (parseInt(m[2],10)*10 + parseInt(m[1],10)) : -1;
  }
  function knownQuarters(){
    const set = new Set();
    state.requests.forEach(r => { if (r.quarter) set.add(r.quarter); });
    return Array.from(set).sort((a,b) => parseQuarterSort(a) - parseQuarterSort(b));
  }
  // Quarter is treated as a curated-vocabulary entity, exactly like customer
  // and topic (see docs/DESIGN.md): the word "quarter"/"quarters"/"this
  // quarter" (a request to see all of them), or a literal quarter value that
  // already exists on a request (e.g. "Q4", "Q3 2026", "Unscheduled"). Never
  // free-text — a quarter not actually in use can't be "found".
  function matchQuarterQuery(text){
    const t = text.trim().toLowerCase();
    if (/\bquarters?\b/.test(t) || /this quarter/.test(t) || /planned/.test(t)) return { allQuarters: true };
    const quarters = knownQuarters();
    const exact = quarters.find(q => q.toLowerCase() === t);
    if (exact) return { allQuarters: true, focus: exact };
    const qOnly = /^q([1-4])$/i.exec(t.replace(/\s+/g,""));
    if (qOnly){
      const m = quarters.find(q => new RegExp("^Q"+qOnly[1]+"\\b","i").test(q));
      if (m) return { allQuarters: true, focus: m };
    }
    if (/unscheduled/.test(t) && quarters.includes("Unscheduled")) return { allQuarters: true, focus: "Unscheduled" };
    return null;
  }
  function knownValuesFor(field, presets){
    const extras = new Set();
    state.requests.forEach(r => { if (r[field] && !(presets||[]).includes(r[field])) extras.add(r[field]); });
    return (presets||[]).concat(Array.from(extras).sort());
  }
  function wireAddableSelect(selectEl, inputEl, onCommit){
    selectEl.onchange = () => {
      if (selectEl.value === "__new__"){
        inputEl.style.display = "block";
        inputEl.focus();
        return;
      }
      onCommit(selectEl.value, false);
    };
