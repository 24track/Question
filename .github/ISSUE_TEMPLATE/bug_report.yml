name: Bug report
description: Something isn't working the way you expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Question. Issues here are public, so please **don't paste or screenshot your real requests, questions or notes**. Use made-up examples if you need to show what happened.
  - type: input
    id: version
    attributes:
      label: Question version
      description: The version in the name of the file you downloaded, for example 0.1.4.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer and operating system
      description: For example, "MacBook Air M2, macOS 15.1".
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. A screenshot with no private data in it is welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or type just before it happened?
      placeholder: |
        1. Open the app
        2. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
